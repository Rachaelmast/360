<title>SkyBridge 360 Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: brand bar + tab strip over one centered working column; the feedback flow uses a step rail + card. */
:root{
  --brand:#0054A6; --brand-2:#9B5B9B;
  --s-others:#0054A6; --s-self:#9B5B9B;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#edf1f7; --surface-3:#e2e8f2;
  --ink:#121d33; --muted:#56627d; --line:#dbe2ec;
  --on-brand:#ffffff;
  --good:#1c7448; --good-bg:#e1f3e8; --warn:#8f5400; --warn-bg:#fcefd6; --bad:#a12f2f; --bad-bg:#fae3e3;
  --focus:#0054A6;
  --shadow:0 1px 2px rgba(18,29,51,.05), 0 8px 24px rgba(18,29,51,.06);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#5b9cf0; --brand-2:#d0679a; --s-others:#4a8be6; --s-self:#d0679a;
  --bg:#0d1422; --surface:#141d2f; --surface-2:#1b263c; --surface-3:#243250;
  --ink:#e7ecf6; --muted:#9ba7c2; --line:#28344f; --on-brand:#0a1220;
  --good:#6fd29f; --good-bg:#13301f; --warn:#f2bd62; --warn-bg:#33260e; --bad:#f08a8a; --bad-bg:#3a1a1a;
  --focus:#8bb8f5; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#5b9cf0; --brand-2:#d0679a; --s-others:#4a8be6; --s-self:#d0679a;
  --bg:#0d1422; --surface:#141d2f; --surface-2:#1b263c; --surface-3:#243250;
  --ink:#e7ecf6; --muted:#9ba7c2; --line:#28344f; --on-brand:#0a1220;
  --good:#6fd29f; --good-bg:#13301f; --warn:#f2bd62; --warn-bg:#33260e; --bad:#f08a8a; --bad-bg:#3a1a1a;
  --focus:#8bb8f5; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
a{color:var(--brand)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.mark{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:11px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.brand{background:color-mix(in oklab,var(--brand) 14%,var(--surface));color:var(--brand)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .trk{width:34px;height:20px;border-radius:99px;background:var(--surface-3);position:relative;transition:background .15s}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .trk{background:var(--brand)}
.switch input:checked + .trk::after{transform:translateX(14px)}
.switch input:focus-visible + .trk{outline:2px solid var(--focus);outline-offset:2px}

.tabs{display:flex;gap:2px;overflow-x:auto;margin-block:18px 22px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font:600 .94rem var(--font-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

.demo-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.86rem;margin-bottom:18px}
.demo-bar b{font-weight:700}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid2 > *,.grid3 > *{min-width:0}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .9rem var(--font-body);border-radius:9px;padding:9px 16px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);padding-inline:10px}
.btn.quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in oklab,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 11px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.msg{font-size:.86rem;font-weight:600}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.notice{padding:14px 16px;border-radius:10px;background:var(--surface-2);font-size:.92rem}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 .9rem var(--font-display);background:color-mix(in oklab,var(--brand) 15%,var(--surface));color:var(--brand)}
.avatar.lg{width:56px;height:56px;font-size:1.15rem}
.person{display:flex;gap:12px;align-items:center;min-width:0}
.person > div{min-width:0}
.person b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:36px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:56px;height:56px;color:var(--muted);opacity:.7}

/* KPI tiles */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font:800 1.85rem/1.1 var(--font-display);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .v small{font-size:.95rem;font-weight:600;color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter > span{display:block;height:100%;border-radius:99px;background:var(--brand)}

/* review cards */
.rcard{display:flex;flex-direction:column;gap:14px}
.rcard .head{display:flex;gap:12px;align-items:center}
.ring{flex:none}
.ring text{font:700 12px var(--font-body);fill:var(--ink)}
.rels{display:flex;flex-wrap:wrap;gap:6px}
.rel{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rel.done{border-color:transparent;background:var(--good-bg);color:var(--good)}

/* company pulse bars */
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:.88rem}
.hbar .trk{height:10px;border-radius:99px;background:var(--surface-2);position:relative}
.hbar .trk span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--s-others)}
.hbar .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* feedback: chooser */
.chooser{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pick{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;min-width:0}
.pick:hover{border-color:var(--brand)}
.pick[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in oklab,var(--brand) 30%,transparent)}
.pick:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:600 .88rem var(--font-body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* feedback: wizard */
.wiz{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px}
.rail button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:.86rem;color:var(--muted);cursor:pointer}
.rail button:hover{background:var(--surface-2);color:var(--ink)}
.rail button[aria-current="step"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.rail button:focus-visible{outline:2px solid var(--focus)}
.rail .st{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.rail .st.part{border-color:var(--brand)}
.rail .st.full{border-color:var(--brand);background:var(--brand)}
.rail .st.full svg{width:10px;height:10px;color:var(--on-brand)}
.rail .grp{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 10px 4px}
.wtop{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px}
.progress{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:16px}
.progress > span{display:block;height:100%;background:var(--brand);transition:width .25s ease}
.stmt{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;border-radius:0}
.stmt:first-of-type{border-top:0}
.stmt.active .stxt{color:var(--ink)}
.stmt.active{box-shadow:inset 3px 0 0 var(--brand);padding-left:14px;margin-left:-14px}
.stxt{font-size:1rem;font-weight:500}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.8fr);gap:6px}
.scale button{all:unset;box-sizing:border-box;border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:1px;min-width:0}
.scale button b{font:700 1rem var(--font-display);font-variant-numeric:tabular-nums}
.scale button span{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale button:hover{border-color:var(--brand)}
.scale button[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.scale button[aria-checked="true"] span{color:var(--on-brand);opacity:.85}
.scale button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
details.cmt summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:.88rem;list-style:none}
details.cmt summary::-webkit-details-marker{display:none}
details.cmt[open] summary{margin-bottom:8px}
.wnav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.kbd{font:600 .72rem var(--font-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--surface)}
.sumlist{display:flex;flex-direction:column}
.sumlist > div{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.sumlist > div:first-child{border-top:0}
.done-check{width:76px;height:76px}
.done-check circle{stroke:var(--good);stroke-width:4;fill:var(--good-bg)}
.done-check path{stroke:var(--good);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (max-width:760px){
  .wiz{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .rail .grp,.rail .lbl{display:none}
  .rail button{padding:6px}
  .scale{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.heat td.h{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-radius:6px;border:2px solid var(--surface);padding:8px 6px;min-width:64px}
.heat th.c{text-align:center}

/* report */
.rhead{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.radar-wrap{display:flex;flex-direction:column;gap:8px}
.radar{width:100%;height:auto;max-width:640px;margin:0 auto;display:block}
.rgrid{display:grid;gap:16px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.rgrid > *{min-width:0}
@media (max-width:860px){.rgrid{grid-template-columns:1fr}}
.radar .grid{fill:none;stroke:var(--line)}
.radar .ax{stroke:var(--line)}
.radar .lbl{font:600 13px var(--font-body);fill:var(--muted)}
.radar .rl{font:500 10px var(--font-body);fill:var(--muted)}
.radar .po{fill:color-mix(in oklab,var(--s-others) 18%,transparent);stroke:var(--s-others);stroke-width:2}
.radar .ps{fill:none;stroke:var(--s-self);stroke-width:2;stroke-dasharray:5 4}
.radar .mo{fill:var(--s-others);stroke:var(--surface);stroke-width:2}
.radar .ms{fill:var(--s-self);stroke:var(--surface);stroke-width:2}
.radar .hit{fill:transparent;cursor:default}
.key{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:.8rem;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key svg{width:22px;height:10px}
.glance{display:flex;flex-direction:column;gap:18px}
.glance ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.glance li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;font-size:.9rem}
.score{font:700 .82rem var(--font-body);font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px;background:var(--surface-2)}
.score.good{background:var(--good-bg);color:var(--good)}
.score.bad{background:var(--bad-bg);color:var(--bad)}
.score.warn{background:var(--warn-bg);color:var(--warn)}
.cbars{display:flex;flex-direction:column;gap:12px}
.cbar{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 84px;gap:12px;align-items:center}
.cbar .nm{font-weight:600;font-size:.88rem}
.cbar .trk{position:relative;height:14px;border-radius:4px;background:var(--surface-2)}
.cbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s-others)}
.cbar .self{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:2px;background:var(--s-self);box-shadow:0 0 0 2px var(--surface)}
.cbar .vals{font-size:.84rem;text-align:right;font-variant-numeric:tabular-nums}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--brand);font-size:.9rem}
.stmts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.stmts > div{display:grid;grid-template-columns:minmax(0,1fr) 48px 48px;gap:10px;font-size:.86rem;padding:6px 0;border-top:1px solid var(--line)}
.plan{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.plan > div{border:1px solid var(--line);border-radius:11px;padding:16px;background:var(--surface)}
.plan ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.quotes{display:flex;flex-direction:column;gap:8px}
.quote{padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:.92rem}
.quote .who{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.qtabs{display:flex;gap:6px;flex-wrap:wrap}
.ai{border:1px solid color-mix(in oklab,var(--brand) 35%,var(--line));background:color-mix(in oklab,var(--brand) 5%,var(--surface))}
.ai .theme{padding:12px 0;border-top:1px solid var(--line)}
.ai .theme:first-child{border-top:0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 9px;border-radius:7px;max-width:260px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.copybox{width:100%;min-height:120px;font-size:.86rem}

@media (max-width:640px){
  .cbar,.hbar{grid-template-columns:1fr 60px}
  .cbar .nm,.hbar .nm{grid-column:1 / -1}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.done-check path{stroke-dashoffset:0}}
</style>

<div class="wrap">
  <header class="top">
    <div class="mark">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="10" stroke="#fff" stroke-width="2" opacity=".45"/><path d="M13 3a10 10 0 0 1 10 10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="13" cy="13" r="3.2" fill="#fff"/></svg>
      </div>
      <div>
        <div class="eyebrow">SkyBridge Healthcare</div>
        <h1>360 Review</h1>
      </div>
    </div>
    <div class="top-right">
      <label class="switch" id="demo-switch" hidden><input type="checkbox" id="demo-toggle"><span class="trk"></span>Sample data</label>
      <span class="chip" id="mode"><span class="dot"></span>Saved in this browser</span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-overview" aria-controls="p-overview" data-admin>Overview</button>
    <button role="tab" id="t-give" aria-controls="p-give">Give feedback</button>
    <button role="tab" id="t-reviews" aria-controls="p-reviews" data-admin>Reviews</button>
    <button role="tab" id="t-reports" aria-controls="p-reports" data-admin>Reports</button>
    <button role="tab" id="t-bank" aria-controls="p-bank">Question bank</button>

async function connect(){
  S.real.cycles = LS.get("sb360.cycles",[]); S.real.responses = LS.get("sb360.responses",[]);
  render();
  if(!window.claude || !window.claude.use) return;
  try{
    claude.use("sample").then(fn=>{ S.sample = fn; render(); }).catch(()=>{});
    claude.use("downloads").then(d=>{ S.downloads = d; }).catch(()=>{});
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const [owner,edit] = await Promise.all([user.isOwner(), user.canEdit()]);
    Object.assign(S,{mode:"shared",db,uid,admin:owner||edit});
    S.real = {cycles:[],responses:[]};
    db.collection("cycles").onSnapshot(snap=>{ S.real.cycles = snap.docs.map(d=>d.data()); render(); }, ()=>{});
    if(S.admin){
      db.collection("responses").onSnapshot(snap=>{
        const out = [];
        snap.docs.forEach(d=>{ const subs=(d.data()||{}).subs||{}; Object.values(subs).forEach(r=>out.push({...r,id:d.id+":"+r.cycleId})); });
        S.real.responses = out; render();
      }, ()=>{});
    }
    render();
  }catch(e){ /* stay local */ }
}

function scoreOf(list, items){
  const v = list.flatMap(r=>items.map(it=>r.ratings[it.id]).filter(x=>typeof x==="number"));
  return avg(v);
}
function analyze(cycle, resps){
  const secs = sectionsFor(cycle.role);
  const self = resps.filter(r=>r.rel==="self"), others = resps.filter(r=>r.rel!=="self");
  const counts = {}; resps.forEach(r=>counts[r.rel]=(counts[r.rel]||0)+1);
  const comp = secs.map(s=>({s, o:scoreOf(others,s.items), me:self.length?scoreOf(self,s.items):null}));
  const stmts = secs.flatMap(s=>s.items.map(it=>({s,it,o:scoreOf(others,[it]),me:self.length?scoreOf(self,[it]):null})));
  const overall = avg(comp.map(c=>c.o).filter(v=>v!=null));
  const selfAll = self.length ? avg(comp.map(c=>c.me).filter(v=>v!=null)) : null;
  const groups = {};
  others.forEach(r=>{ const k = (r.rel==="manager" || counts[r.rel]>=3) ? r.rel : "other"; (groups[k]=groups[k]||[]).push(r); });
  const order = ["manager","peer","report","partner","other"].filter(k=>groups[k]);
  return {secs,self,others,counts,comp,stmts,overall,selfAll,groups,order};
}
function progressOf(c){
  const t = targetsFor(c.role), have = {}; respFor(c.id).forEach(r=>have[r.rel]=(have[r.rel]||0)+1);
  let need=0, got=0; Object.entries(t).forEach(([k,n])=>{ need+=n; got+=Math.min(n,have[k]||0); });
  return {t,have,pct: need? got/need : 0, total: respFor(c.id).length};
}

function ring(pct, size=52){
  const r = (size-8)/2, C = 2*Math.PI*r, off = C*(1-pct);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(pct*100)}% of target responses">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="6"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--brand)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central">${Math.round(pct*100)}%</text></svg>`;
}
function radar(comp){
  const n = comp.length, R = 150, cx = 0, cy = 0;
  const ang = i => -Math.PI/2 + i*2*Math.PI/n;
  const pt = (i,v) => { const r = R*((v??1)-1)/4; return [cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))]; };
  const rings = [2,3,4,5].map(v=>`<polygon class="grid" points="${comp.map((_,i)=>pt(i,v).join(",")).join(" ")}"/>`).join("");
  const axes = comp.map((_,i)=>{ const [x,y]=pt(i,5); return `<line class="ax" x1="0" y1="0" x2="${x}" y2="${y}"/>`; }).join("");
  const ringLbl = [2,3,4,5].map(v=>`<text class="rl" x="4" y="${-R*(v-1)/4+3}">${v}</text>`).join("");
  const labels = comp.map((c,i)=>{
    const a = ang(i), x = (R+16)*Math.cos(a), y = (R+16)*Math.sin(a);
    const anchor = Math.cos(a)>.25 ? "start" : Math.cos(a)<-.25 ? "end" : "middle";
    const dy = Math.sin(a)>.5 ? 10 : Math.sin(a)<-.5 ? -2 : 4;
    return `<text class="lbl" x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anchor}">${esc(c.s.short||c.s.name)}</text>`;
  }).join("");
  const poly = (key,cls) => comp.every(c=>c[key]!=null) ? `<polygon class="${cls}" points="${comp.map((c,i)=>pt(i,c[key]).join(",")).join(" ")}"/>` : "";
  const hasSelf = comp.some(c=>c.me!=null);
  const marks = comp.map((c,i)=>{
    const tip = `${c.s.name}: others ${fmt2(c.o)}${c.me!=null?" · self "+fmt2(c.me):""}`;
    const [ox,oy] = pt(i,c.o); let m = c.o!=null ? `<circle class="mo" cx="${ox}" cy="${oy}" r="4.5"/>` : "";
    if(c.me!=null){ const [sx,sy]=pt(i,c.me); m += `<rect class="ms" x="${sx-4}" y="${sy-4}" width="8" height="8" transform="rotate(45 ${sx} ${sy})"/>`; }
    const [hx,hy] = pt(i,c.o??3);
    return m + `<circle class="hit" cx="${hx}" cy="${hy}" r="14" data-tip="${esc(tip)}" tabindex="0" aria-label="${esc(tip)}"/>`;
  }).join("");
  return `<svg class="radar" viewBox="-300 -190 600 385" role="img" aria-label="Radar chart of competency scores">
    ${rings}${axes}${ringLbl}${poly("o","po")}${hasSelf?poly("me","ps"):""}${marks}${labels}</svg>
    <div class="key"><span><svg viewBox="0 0 22 10"><line x1="1" y1="5" x2="21" y2="5" stroke="var(--s-others)" stroke-width="2.5"/><circle cx="11" cy="5" r="3.5" fill="var(--s-others)"/></svg>Others' average</span>
    ${hasSelf?`<span><svg viewBox="0 0 22 10"><line x1="1" y1="5" x2="21" y2="5" stroke="var(--s-self)" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="8" y="2" width="6" height="6" fill="var(--s-self)" transform="rotate(45 11 5)"/></svg>Self</span>`:""}</div>`;
}
const heatBg = v => v==null ? "transparent" : `color-mix(in oklab, var(--s-others) ${Math.round(((v-1)/4)*42)}%, var(--surface))`;
const EMPTY_ICON = `<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2"><rect x="10" y="8" width="36" height="42" rx="6"/><path d="M19 20h18M19 28h18M19 36h10" stroke-linecap="round"/></svg>`;

const TABS = ["overview","give","reviews","reports","bank"];
let tab = null;
function allowedTabs(){ return S.admin ? TABS : ["give","bank"]; }
function showTab(name){
  if(!allowedTabs().includes(name)) name = allowedTabs()[0];
  tab = name;
  TABS.forEach(t=>{ $("t-"+t).setAttribute("aria-selected",String(t===name)); $("p-"+t).hidden = t!==name; });
  try{ sessionStorage.setItem("sb360.tab",name); }catch(e){}
  renderTab();
}
TABS.forEach(t=>$("t-"+t).addEventListener("click",()=>showTab(t)));

function render(){
  document.querySelectorAll("[data-admin]").forEach(el=>el.hidden=!S.admin);
  const demo = demoOn();
  $("demo-bar").hidden = !demo;
  $("demo-switch").hidden = !S.admin;
  $("demo-toggle").checked = demo;
  const m = $("mode");
  if(S.mode==="shared"){ m.className="chip good"; m.innerHTML = `<span class="dot"></span>${S.admin?"Shared · leadership view":"Shared · feedback is anonymous"}`; }
  else { m.className="chip"; m.innerHTML = `<span class="dot"></span>Saved in this browser`; }
  if(!allowedTabs().includes(tab)) return showTab(allowedTabs()[0]);
  renderTab();
}
function renderTab(){
  ({overview:renderOverview, give:renderGive, reviews:renderReviews, reports:renderReports, bank:renderBank})[tab]();
}
$("demo-toggle").addEventListener("change",e=>{ S.demoPref = e.target.checked; G.step=null; render(); });

function renderOverview(){
  const cs = cycles(), open = cs.filter(c=>c.status!=="closed");
  const el = $("p-overview");
  if(!cs.length){
    el.innerHTML = `<div class="card empty">${EMPTY_ICON}<h2>Start your first review</h2><p class="muted" style="max-width:46ch">Open a review for an employee, then share this page with their manager, peers and partners. Progress and results show up here.</p><button class="btn" data-act="go-reviews">Open a review</button></div>`;
    return;
  }
  const prog = open.map(c=>({c,p:progressOf(c)}));
  const allResp = cs.flatMap(c=>respFor(c.id));
  const totalResp = allResp.length;
  const avgPct = prog.length ? avg(prog.map(x=>x.p.pct)) : 0;
  const dueSoon = open.filter(c=>{ const n=daysUntil(c.due); return n!=null && n<=3; }).length;
  const othersAll = allResp.filter(r=>r.rel!=="self");
  const pulse = CORE.map(c=>({c, v:scoreOf(othersAll, c.items.map((_,i)=>({id:`core.${c.id}.${i}`})))})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  const period = open[0] ? open[0].period : cs[0].period;

  el.innerHTML = `
    <div class="row"><div><div class="eyebrow">${esc(period)} review season</div><h2>${open.length} review${open.length===1?"":"s"} in progress</h2></div><span class="spacer"></span><button class="btn" data-act="go-reviews">Open a review</button></div>
    <div class="kpis">
      <div class="kpi"><div class="eyebrow">Open reviews</div><div class="v">${open.length}</div><div class="tiny muted">${cs.length-open.length} closed</div></div>
      <div class="kpi"><div class="eyebrow">Responses in</div><div class="v">${totalResp}</div><div class="tiny muted">across all reviews</div></div>
      <div class="kpi"><div class="eyebrow">Completion</div><div class="v">${Math.round(avgPct*100)}<small>%</small></div><div class="meter"><span style="width:${Math.round(avgPct*100)}%"></span></div></div>
      <div class="kpi"><div class="eyebrow">Due in 3 days or less</div><div class="v">${dueSoon}</div><div class="tiny muted">${dueSoon?"send a reminder":"nothing urgent"}</div></div>
    </div>
    <div class="grid3">
      ${prog.sort((a,b)=>(daysUntil(a.c.due)??99)-(daysUntil(b.c.due)??99)).map(({c,p})=>`
        <div class="card rcard">
          <div class="head">
            <div class="avatar">${esc(initials(c.name))}</div>
            <div style="min-width:0;flex:1"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</b><span class="small muted">${esc(ROLES[c.role].title)}</span></div>
            ${ring(p.pct)}
          </div>
          <div class="row">${dueChip(c)}<span class="tiny muted">${p.total} response${p.total===1?"":"s"}</span></div>
          <div class="rels">${Object.entries(p.t).map(([k,n])=>{ const h=Math.min(n,p.have[k]||0); return `<span class="rel ${h>=n?"done":""}">${rel(k).pl} ${n===1?(h?"✓":"–"):h+"/"+n}</span>`; }).join("")}</div>
          <div class="row"><button class="btn sm ghost" data-act="report" data-id="${esc(c.id)}">View report</button><button class="btn sm quiet" data-act="invite" data-id="${esc(c.id)}">Copy invite</button></div>
        </div>`).join("")}
    </div>
    ${pulse.length?`<div class="card stack">
      <div><h2>Company pulse</h2><p class="small muted">Average rating on the six core competencies across every review, from everyone but the person being reviewed.</p></div>
      <div class="hbars">${pulse.map((x,i)=>`
        <div class="hbar"><span class="nm">${esc(x.c.name)}${i===0?` <span class="chip good" style="margin-left:4px">Strongest</span>`:i===pulse.length-1?` <span class="chip warn" style="margin-left:4px">Invest here</span>`:""}</span>
          <div class="trk" data-tip="${esc(x.c.name)}: ${fmt2(x.v)} of 5"><span style="width:${((x.v-1)/4*100).toFixed(1)}%"></span></div><span class="val">${fmt(x.v)}</span></div>`).join("")}

   Give feedback (guided flow)
   ========================================================= */
const G = {cycleId:null, rel:null, step:null, draft:null, active:0, q:""};
const draftKey = () => `sb360.draft.${G.cycleId}.${G.rel}`;
function saveDraft(){ if(G.draft) LS.set(draftKey(), G.draft); }
function steps(){ const c = cycles().find(x=>x.id===G.cycleId); return c ? sectionsFor(c.role) : []; }

function renderGive(){
  const el = $("p-give");
  const open = cycles().filter(c=>c.status!=="closed");
  if(G.step==="done") return renderDone(el);
  if(G.step!=null && open.some(c=>c.id===G.cycleId)) return renderWizard(el);
  G.step = null;
  if(!open.length){
    el.innerHTML = `<div class="card empty">${EMPTY_ICON}<h2>No reviews to fill out yet</h2>
      <p class="muted" style="max-width:46ch">${S.admin?"Open a review for an employee first. It will show up here for reviewers to pick.":"Your manager hasn't opened a review yet. Once they do, it will show up here."}</p>
      ${S.admin?`<button class="btn" data-act="go-reviews">Open a review</button>`:""}</div>`;
    return;
  }
  const q = G.q.trim().toLowerCase();
  const list = open.filter(c=>!q || c.name.toLowerCase().includes(q) || ROLES[c.role].title.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  const c = open.find(x=>x.id===G.cycleId);
  const rels = c ? RELS.filter(r=> r.id!=="report" || c.role==="director" || c.role==="evp") : [];
  if(c && !rels.some(r=>r.id===G.rel)) G.rel = null;
  const hasDraft = c && G.rel && LS.get(`sb360.draft.${c.id}.${G.rel}`,null);
  const mins = c ? Math.round(sectionsFor(c.role).reduce((n,s)=>n+s.items.length,0)*0.25+3) : 0;
  el.innerHTML = `
    <div class="card stack">
      <div><div class="eyebrow">Step 1 of 2</div><h2>Who are you reviewing?</h2></div>
      ${open.length>6?`<input type="search" id="g-search" placeholder="Search by name or title" value="${esc(G.q)}" aria-label="Search reviews">`:""}
      <div class="chooser">${list.map(x=>`
        <button class="pick" data-act="pick" data-id="${esc(x.id)}" aria-pressed="${x.id===G.cycleId}">
          <div class="avatar">${esc(initials(x.name))}</div>
          <div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</b><span class="small muted">${esc(ROLES[x.role].title)} · ${esc(x.period)}</span></div>
        </button>`).join("") || `<p class="muted small">No matches.</p>`}</div>
    </div>
    ${c?`<div class="card stack">
      <div><div class="eyebrow">Step 2 of 2</div><h2>How do you work with ${esc(c.name.replace(/^Sample:\s*/,""))}?</h2></div>
      <div class="seg" role="group" aria-label="Relationship">${rels.map(r=>`<button data-act="rel" data-rel="${r.id}" aria-pressed="${r.id===G.rel}">${r.id==="self"?"This is me (self review)":r.l}</button>`).join("")}</div>
      <div class="row">
        <button class="btn" data-act="start" ${G.rel?"":"disabled"}>${hasDraft?"Resume your draft":"Start feedback"}</button>
        <span class="small muted">About ${mins} minutes · ${sectionsFor(c.role).length} short sections · your draft saves as you go</span>
      </div>
      <p class="tiny muted">Your name never appears in the report. Peer, direct report and partner feedback is only shown as a group once 3 or more people respond; smaller groups are combined.</p>
    </div>`:""}`;
  const s = $("g-search"); if(s){ s.addEventListener("input",()=>{ G.q=s.value; const pos=s.selectionStart; renderGive(); const n=$("g-search"); n.focus(); n.setSelectionRange(pos,pos); }); }
}

function startWizard(){
  G.draft = LS.get(draftKey(), null) || {ratings:{},comments:{},open:{}};
  const secs = steps();
  const first = secs.findIndex(s=>s.items.some(it=>G.draft.ratings[it.id]==null));
  G.step = first<0 ? secs.length : first; G.active = 0;
  renderGive(); window.scrollTo({top:0});
}
function secState(s){ const n = s.items.filter(it=>G.draft.ratings[it.id]!=null).length; return n===0?"":n===s.items.length?"full":"part"; }

function renderWizard(el){
  const c = cycles().find(x=>x.id===G.cycleId), secs = steps(), self = G.rel==="self";
  const total = secs.reduce((n,s)=>n+s.items.length,0), done = Object.keys(G.draft.ratings).length;
  const isOpen = G.step===secs.length, isSum = G.step===secs.length+1;
  const who = c.name.replace(/^Sample:\s*/,"");
  let groupShown = "";
  const railItems = secs.map((s,i)=>{
    let g = ""; if(s.group!==groupShown){ groupShown=s.group; g=`<div class="grp">${esc(s.group)}</div>`; }
    const st = secState(s);
    return g+`<button data-act="goto" data-step="${i}" ${G.step===i?'aria-current="step"':""} title="${esc(s.name)}"><span class="st ${st}">${st==="full"?ICON_CHECK:""}</span><span class="lbl">${esc(s.short||s.name)}</span></button>`;
  }).join("");
  const openSt = OPEN.some(o=>(G.draft.open[o.id]||"").trim()) ? "full" : "";
  const rail = `<nav class="rail" aria-label="Sections">${railItems}<div class="grp">Wrap up</div>
    <button data-act="goto" data-step="${secs.length}" ${isOpen?'aria-current="step"':""}><span class="st ${openSt}">${openSt?ICON_CHECK:""}</span><span class="lbl">Written feedback</span></button>
    <button data-act="goto" data-step="${secs.length+1}" ${isSum?'aria-current="step"':""}><span class="st"></span><span class="lbl">Review & submit</span></button></nav>`;

  let body;
  if(isOpen){
    body = `<div class="eyebrow">Written feedback</div><h2>In your own words</h2>
      <p class="muted small" style="margin-top:4px">Specific examples help most: a candidate, a client call, a tough week. All three are optional.</p>
      <div class="stack" style="margin-top:16px">${OPEN.map(o=>`<label class="f">${esc(self?o.self:o.q)}<textarea id="open-${o.id}" data-open="${o.id}">${esc(G.draft.open[o.id]||"")}</textarea></label>`).join("")}</div>`;
  } else if(isSum){
    const missing = total-done;
    body = `<div class="eyebrow">Last step</div><h2>Review & submit</h2>
      <p class="muted small" style="margin-top:4px">${missing?`${missing} statement${missing===1?"":"s"} still need a rating. Use N/A when you haven't seen it.`:`Everything is rated. You can still go back and change anything.`}</p>
      <div class="sumlist" style="margin-top:12px">${secs.map((s,i)=>{
        const vals = s.items.map(it=>G.draft.ratings[it.id]).filter(v=>typeof v==="number"), left = s.items.filter(it=>G.draft.ratings[it.id]==null).length;
        return `<div><span style="flex:1;min-width:0">${esc(s.name)}</span>${left?`<button class="btn sm ghost" data-act="goto" data-step="${i}">${left} to rate</button>`:`<span class="score ${tone(avg(vals))}">${vals.length?fmt(avg(vals)):"N/A"}</span>`}</div>`;
      }).join("")}</div>`;
  } else {
    const s = secs[G.step];
    body = `<div class="eyebrow">${esc(s.group)} · Section ${G.step+1} of ${secs.length}</div><h2>${esc(s.name)}</h2>
      <p class="muted small" style="margin-top:4px">${esc(s.d||"")}</p>
      <div style="margin-top:8px">${s.items.map((it,i)=>{
        const v = G.draft.ratings[it.id];
        return `<div class="stmt ${i===G.active?"active":""}" data-idx="${i}">
          <div class="stxt">${esc(it.t)}</div>
          <div class="scale" role="radiogroup" aria-label="${esc(it.t)}">
            ${SCALE.map(x=>`<button role="radio" aria-checked="${v===x.v}" data-act="rate" data-item="${it.id}" data-idx="${i}" data-v="${x.v}"><b>${x.v}</b><span>${x.l}</span></button>`).join("")}
            <button role="radio" aria-checked="${v==="na"}" data-act="rate" data-item="${it.id}" data-idx="${i}" data-v="na"><b>N/A</b><span>Haven't seen</span></button>
          </div></div>`;
      }).join("")}</div>
      <details class="cmt" ${G.draft.comments[s.id]?"open":""} style="margin-top:6px"><summary>+ Add a comment on ${esc(s.short||s.name)}</summary>
        <textarea id="cmt-${s.id}" data-cmt="${s.id}" placeholder="Optional">${esc(G.draft.comments[s.id]||"")}</textarea></details>`;
  }
  const last = secs.length+1;
  el.innerHTML = `
    <div class="wtop"><div class="person"><div class="avatar">${esc(initials(c.name))}</div><div><b>${esc(who)}</b><span class="small muted">${esc(ROLES[c.role].title)} · you're giving ${self?"your self review":esc(rel(G.rel).l.toLowerCase())+" feedback"}</span></div></div>
      <span class="spacer"></span><span class="small muted num">${done} of ${total} rated</span><button class="btn sm quiet" data-act="exit">Save & exit</button></div>
    <div class="progress"><span style="width:${(100*done/total).toFixed(1)}%"></span></div>
    <div class="wiz">${rail}
      <div class="card">${body}
        <div class="wnav">
          ${G.step>0?`<button class="btn ghost" data-act="prev">Back</button>`:""}
          <span class="spacer"></span>
          ${!isOpen&&!isSum?`<span class="tiny muted" style="display:none" id="kb-hint">Keys <span class="kbd">1</span>–<span class="kbd">5</span> rate · <span class="kbd">N</span> N/A</span>`:""}
          ${isSum?`<span class="msg" id="g-msg" role="status"></span><button class="btn" data-act="submit" ${total-done?"disabled":""}>Submit feedback</button>`:`<button class="btn" data-act="next">${G.step===last-1?"Review answers":"Next"}</button>`}
        </div>
      </div>
    </div>`;
  const h = $("kb-hint"); if(h && matchMedia("(hover:hover)").matches) h.style.display="";
}
function renderDone(el){
  const c = cycles().find(x=>x.id===G.cycleId);
  const left = cycles().filter(x=>x.status!=="closed" && x.id!==G.cycleId).length;
  el.innerHTML = `<div class="card empty">
    <svg class="done-check" viewBox="0 0 76 76"><circle cx="38" cy="38" r="34"/><path d="M24 39l9 9 19-20"/></svg>
    <h2>Thank you. Your feedback is in.</h2>
    <p class="muted" style="max-width:48ch">${demoOn()?"This was sample mode, so nothing was saved. ":""}${c?esc(c.name.replace(/^Sample:\s*/,""))+" will see it combined with other reviewers' feedback, never with your name.":""}</p>
    <div class="row" style="justify-content:center">${left?`<button class="btn" data-act="another">Review someone else</button>`:""}${S.admin&&c?`<button class="btn ghost" data-act="report" data-id="${esc(c.id)}">See the report</button>`:""}</div></div>`;
}
function rate(item, idx, v){
  G.draft.ratings[item] = v==="na" ? "na" : Number(v);
  saveDraft();
  const s = steps()[G.step];
  const nextIdx = s.items.findIndex((it,i)=>i>idx && G.draft.ratings[it.id]==null);
  G.active = nextIdx>=0 ? nextIdx : Math.min(idx+1, s.items.length-1);
  renderGive();
  const row = document.querySelector(`.stmt[data-idx="${G.active}"]`);
  if(row && nextIdx>=0){ row.scrollIntoView({block:"nearest",behavior:"smooth"}); row.querySelector("button")?.focus({preventScroll:true}); }
}
async function submitFeedback(){
  const msg = $("g-msg");
  const resp = {cycleId:G.cycleId, rel:G.rel, ratings:G.draft.ratings,
    comments:Object.fromEntries(Object.entries(G.draft.comments).filter(([,v])=>v.trim())),
    open:Object.fromEntries(Object.entries(G.draft.open).filter(([,v])=>v.trim())),
    submittedAt:new Date().toISOString()};
  try{
    document.querySelector('[data-act="submit"]').disabled = true;
    await Store.submit(resp);
    LS.del(draftKey()); G.step="done"; renderGive(); window.scrollTo({top:0});
  }catch(e){
    msg.className="msg bad";
    msg.textContent = e && e.code==="invalid_argument" ? "You have view-only access. Ask the page owner for Contributor access." : "Couldn't save. Check your connection and try again.";
    document.querySelector('[data-act="submit"]').disabled = false;
  }
}
document.addEventListener("keydown",e=>{
  if(tab!=="give" || G.step==null || typeof G.step!=="number") return;
  const secs = steps(); if(G.step>=secs.length) return;
  if(e.target.matches("textarea,input,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const s = secs[G.step], it = s.items[G.active]; if(!it) return;
  const k = e.key.toLowerCase();
  if(["1","2","3","4","5"].includes(k)){ e.preventDefault(); rate(it.id,G.active,k); }
  else if(k==="n" || k==="0"){ e.preventDefault(); rate(it.id,G.active,"na"); }
  else if(k==="arrowdown"){ e.preventDefault(); G.active=Math.min(G.active+1,s.items.length-1); renderGive(); }
  else if(k==="arrowup"){ e.preventDefault(); G.active=Math.max(G.active-1,0); renderGive(); }
});

let pendingDelete = null;
function renderReviews(){
  const el = $("p-reviews");
  const rows = [...cycles()].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  const prevName = $("c-name")?.value || "", prevPeriod = $("c-period")?.value || defaultPeriod();

async function runAI(id){
  const c = cycles().find(x=>x.id===id); if(!c || !S.sample) return;
  const R = respFor(id);
  const lines = R.flatMap(r=>[...Object.entries(r.open||{}).map(([k,v])=>`[${r.rel==="self"?"self":"reviewer"} · ${k}] ${v}`), ...Object.entries(r.comments||{}).map(([k,v])=>`[${r.rel==="self"?"self":"reviewer"} · ${k}] ${v}`)]);
  if(!lines.length){ AI[id]={state:"error",error:"There are no written comments to summarize yet."}; renderReports(); return; }
  AI[id] = {state:"loading"}; renderReports();
  const prompt = `You are helping a healthcare staffing company (SkyBridge Healthcare) summarize 360 feedback for a ${ROLES[c.role].title}.
Below are anonymous written comments. Group them into 3 to 5 themes. Each theme is either a "strength" or an "opportunity". Write plainly, never quote a comment word for word, and never guess who wrote anything.
Then suggest 2 or 3 specific, measurable goals for next period based on the opportunities.
Reply with JSON only, in this shape: {"themes":[{"title":"short title","type":"strength"|"opportunity","summary":"one or two sentences"}],"goals":["goal"]}

Comments:
${lines.join("\n")}`;
  try{
    const data = await S.sample.json(prompt,{modelTier:"default"});
    AI[id] = {state:"done",data};
  }catch(e){
    AI[id] = {state:"error",error: e && e.code==="not_granted" ? "Claude summaries aren't turned on for you. You can allow them in this page's permissions." : e && e.code==="rate_limited" ? "Too many requests right now. Try again in a minute." : "Couldn't create the summary. Try again."};
  }
  if(tab==="reports" && reportId===id) renderReports();
}

async function exportCSV(){
  const c = cycles().find(x=>x.id===reportId); if(!c) return;
  const items = sectionsFor(c.role).flatMap(s=>s.items.map(it=>({...it,sec:s.name})));
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const head = ["Employee","Title","Period","Relationship",...items.map(it=>`${it.sec}: ${it.t}`),...OPEN.map(o=>o.q)];
  const lines = respFor(c.id).map(r=>[c.name,ROLES[c.role].title,c.period,rel(r.rel).l,...items.map(it=>r.ratings[it.id]==="na"?"N/A":r.ratings[it.id]),...OPEN.map(o=>(r.open||{})[o.id]||"")]);
  const text = [head,...lines].map(l=>l.map(q).join(",")).join("\n");
  const name = `360-${c.name.replace(/^Sample:\s*/,"").replace(/[^a-z0-9]+/gi,"-")}-${c.period.replace(/[^a-z0-9]+/gi,"-")}.csv`;
  if(S.downloads){ try{ await S.downloads.save({filename:name,data:text}); }catch(e){} return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type:"text/csv"})); a.download = name; a.click();
}

document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id, c = id ? cycles().find(x=>x.id===id) : null;
  switch(a){
    case "demo-off": S.demoPref=false; G.step=null; render(); break;
    case "go-reviews": showTab("reviews"); setTimeout(()=>$("c-name")?.focus(),0); break;
    case "report": reportId=id; showTab("reports"); window.scrollTo({top:0}); break;
    case "invite": if(c) showInvite(c); break;
    case "close-invite": $("invite-box").innerHTML=""; break;
    case "toggle": if(c){ if(demoOn()){ c.status = c.status==="closed"?"open":"closed"; render(); } else await Store.saveCycle({...c,status:c.status==="closed"?"open":"closed"}).catch(()=>toast("Only Editors can change reviews")); } break;
    case "del": pendingDelete=id; renderReviews(); break;
    case "del-no": pendingDelete=null; renderReviews(); break;
    case "del-yes": pendingDelete=null; if(demoOn()){ S.demo.cycles=S.demo.cycles.filter(x=>x.id!==id); render(); } else await Store.deleteCycle(id).catch(()=>toast("Only Editors can delete reviews")); break;
    case "pick": G.cycleId=id; renderGive(); break;
    case "rel": G.rel=b.dataset.rel; renderGive(); break;
    case "start": startWizard(); break;
    case "goto": G.step=Number(b.dataset.step); G.active=0; renderGive(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "prev": G.step--; G.active=0; renderGive(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "next": G.step++; G.active=0; renderGive(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "exit": saveDraft(); G.step=null; renderGive(); toast("Draft saved on this device"); break;
    case "rate": rate(b.dataset.item, Number(b.dataset.idx), b.dataset.v); break;
    case "submit": submitFeedback(); break;
    case "another": G.step=null; G.cycleId=null; G.rel=null; renderGive(); break;
    case "qtab": quoteTab=b.dataset.k; renderReports(); break;
    case "ai": runAI(id); break;
    case "csv": exportCSV(); break;
    case "bank": bankRole=b.dataset.role; renderBank(); break;
  }
});
document.addEventListener("input", e=>{

/* tooltip */
const tipEl = $("tip");
function showTip(t, x, y){ tipEl.textContent=t; tipEl.hidden=false; const w=tipEl.offsetWidth, h=tipEl.offsetHeight; tipEl.style.left=Math.min(innerWidth-w-8, Math.max(8,x-w/2))+"px"; tipEl.style.top=Math.max(8,y-h-12)+"px"; }
document.addEventListener("pointermove", e=>{ const t=e.target.closest?.("[data-tip]"); if(t) showTip(t.dataset.tip,e.clientX,e.clientY); else tipEl.hidden=true; });
document.addEventListener("focusin", e=>{ const t=e.target.closest?.("[data-tip]"); if(t){ const r=t.getBoundingClientRect(); showTip(t.dataset.tip,r.left+r.width/2,r.top); } });
document.addEventListener("focusout", ()=>{ tipEl.hidden=true; });
addEventListener("scroll", ()=>{ tipEl.hidden=true; }, {passive:true});

/* boot */
let start = "overview"; try{ start = sessionStorage.getItem("sb360.tab") || "overview"; }catch(e){}
tab = TABS.includes(start) ? start : "overview";
showTab(tab);
connect();
</script>
