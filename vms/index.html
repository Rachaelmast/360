<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyBridge VMS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: brand bar + "viewing as" switch + tab strip over one working column; lists are tables, submittals are a stage board, forms open in a dialog. Tokens match SkyBridge 360. */
:root{
  --brand:#0054A6; --brand-2:#9B5B9B;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#edf1f7; --surface-3:#e2e8f2;
  --ink:#121d33; --muted:#56627d; --line:#dbe2ec;
  --on-brand:#ffffff;
  --good:#1c7448; --good-bg:#e1f3e8; --warn:#8f5400; --warn-bg:#fcefd6; --bad:#a12f2f; --bad-bg:#fae3e3;
  --focus:#0054A6; --scrim:rgba(10,16,30,.45);
  --shadow:0 1px 2px rgba(18,29,51,.05), 0 8px 24px rgba(18,29,51,.06);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#5b9cf0; --brand-2:#d0679a;
  --bg:#0d1422; --surface:#141d2f; --surface-2:#1b263c; --surface-3:#243250;
  --ink:#e7ecf6; --muted:#9ba7c2; --line:#28344f; --on-brand:#0a1220;
  --good:#6fd29f; --good-bg:#13301f; --warn:#f2bd62; --warn-bg:#33260e; --bad:#f08a8a; --bad-bg:#3a1a1a;
  --focus:#8bb8f5; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#5b9cf0; --brand-2:#d0679a;
  --bg:#0d1422; --surface:#141d2f; --surface-2:#1b263c; --surface-3:#243250;
  --ink:#e7ecf6; --muted:#9ba7c2; --line:#28344f; --on-brand:#0a1220;
  --good:#6fd29f; --good-bg:#13301f; --warn:#f2bd62; --warn-bg:#33260e; --bad:#f08a8a; --bad-bg:#3a1a1a;
  --focus:#8bb8f5; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
a{color:var(--brand)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.mark{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:11px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.viewas{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.viewas select{width:auto;padding:6px 9px;font-size:.86rem;max-width:220px}
.qtip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:.72rem;font-weight:700;cursor:help}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.brand{background:color-mix(in oklab,var(--brand) 14%,var(--surface));color:var(--brand)}
.chip.sm{font-size:.72rem;padding:2px 8px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .trk{width:34px;height:20px;border-radius:99px;background:var(--surface-3);position:relative;transition:background .15s}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .trk{background:var(--brand)}
.switch input:checked + .trk::after{transform:translateX(14px)}
.switch input:focus-visible + .trk{outline:2px solid var(--focus);outline-offset:2px}

.tabs{display:flex;gap:2px;overflow-x:auto;margin-block:18px 22px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font:600 .94rem var(--font-body);color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tabs .badge{font-size:.7rem;font-weight:700;min-width:19px;padding:1px 6px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-variant-numeric:tabular-nums}

.demo-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.86rem;margin-bottom:18px}
.demo-bar b{font-weight:700}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid2 > *{min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=search],input[type=number],input[type=email],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:76px;resize:vertical;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .9rem var(--font-body);border-radius:9px;padding:9px 16px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);padding-inline:10px}
.btn.quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in oklab,var(--bad) 40%,var(--line))}
.btn.good{background:var(--good);border-color:var(--good);color:var(--on-brand)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.msg{font-size:.86rem;font-weight:600}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)} .msg.warn{color:var(--warn)}
.notice{padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:.9rem}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.empty{text-align:center;padding:32px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:52px;height:52px;color:var(--muted);opacity:.7}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 .84rem var(--font-body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input[type=search]{max-width:260px}
.toolbar select{width:auto}
.head-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}

/* KPI tiles */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.kpi:hover{border-color:var(--brand)}
.kpi:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kpi .v{font:800 1.8rem/1.1 var(--font-display);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .v small{font-size:.92rem;font-weight:600;color:var(--muted)}
.kpi .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter > span{display:block;height:100%;border-radius:99px;background:var(--brand)}

/* attention list */
.alist{display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.aitem:first-child{border-top:0}
.sev{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.sev.bad{background:var(--bad)}
.sev.info{background:var(--brand)}

/* pipeline bars */
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:.88rem}
.hbar .trk{height:10px;border-radius:99px;background:var(--surface-2);position:relative}
.hbar .trk span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--brand)}
.hbar .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* tables */
.tbl{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td b{font-weight:600}
.sub2{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.mono{font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.creds{display:flex;gap:4px;flex-wrap:wrap}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}

/* submittal board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(208px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col > header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.col > header b{font:700 .9rem var(--font-display)}
.col .count{font-size:.76rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;font-size:.84rem;min-width:0}
.scard .nm{font-weight:700;font-size:.92rem;overflow-wrap:anywhere}
.scard .ln{color:var(--muted);overflow-wrap:anywhere}
.scard .row{gap:6px}
.col .none{font-size:.8rem;color:var(--muted);padding:6px 4px}

/* dialog */
.dlg{overflow:auto;border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:var(--shadow)}
.dlg::backdrop{background:var(--scrim)}
.dlg form{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.fgrid .wide{grid-column:1 / -1}
.facts{display:grid;gap:10px 16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));font-size:.88rem}
.facts div span{display:block}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days label{font-size:.72rem;text-align:center}
.days input{text-align:center;padding:8px 4px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 9px;border-radius:7px;max-width:280px;box-shadow:var(--shadow)}

@media (max-width:640px){
  .card{padding:16px}
  .days{grid-template-columns:repeat(4,minmax(0,1fr))}
  .toolbar input[type=search]{max-width:none}
  .viewas{width:100%}
  .viewas select{flex:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* additions: search, AI, checklists, activity, reports */
.kbd{font:600 .7rem var(--font-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}
.searchbtn{display:inline-flex;gap:10px;align-items:center;font:500 .86rem var(--font-body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px 7px 12px;cursor:pointer}
.searchbtn:hover{border-color:var(--brand);color:var(--ink)}
.searchbtn svg{width:15px;height:15px}
.pal-list{display:flex;flex-direction:column;max-height:min(420px,55dvh);overflow:auto;margin-inline:-6px}
.pal-list button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.9rem}
.pal-list button:hover,.pal-list button.on{background:var(--surface-2)}
.pal-list button:focus-visible{outline:2px solid var(--focus)}
.pal-list .k{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.pal-list b{font-weight:600}
.ai{border:1px solid color-mix(in oklab,var(--brand) 35%,var(--line));background:color-mix(in oklab,var(--brand) 5%,var(--surface));border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ai .out{white-space:pre-wrap;font-size:.9rem;line-height:1.55}
.ai-tag{display:inline-flex;gap:6px;align-items:center;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--brand)}
.ai-tag svg{width:14px;height:14px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-size:.92rem}
.checks input{width:18px;height:18px;accent-color:var(--brand)}
.score{display:flex;gap:6px}
.score label{position:relative}
.score input{position:absolute;opacity:0}
.score span{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:9px;font:700 1rem var(--font-display);cursor:pointer;background:var(--surface)}
.score input:checked + span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.score input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.feed{display:flex;flex-direction:column}
.feed > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.88rem}
.feed > div:first-child{border-top:0}
.feed .who{font-weight:600}
.feed time{color:var(--muted);font-size:.78rem;white-space:nowrap}
.budget{display:flex;flex-direction:column;gap:6px}
.budget .trk{position:relative;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.budget .trk .c{position:absolute;inset:0 auto 0 0;background:color-mix(in oklab,var(--brand) 30%,var(--surface-2))}
.budget .trk .i{position:absolute;inset:0 auto 0 0;background:var(--brand)}
.budget .trk .i.over{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.split > *{min-width:0}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.ratecard td input{padding:6px 8px;max-width:110px}
.ratecard td select{padding:6px 8px;width:auto}
@media (max-width:640px){
  .hbar{grid-template-columns:minmax(0,1fr) auto!important}
  .hbar > span:first-child{grid-column:1 / -1}
  .searchbtn .kbd{display:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="mark">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 26 26" fill="none"><path d="M3 18c3-6.5 7-9.5 10-9.5s7 3 10 9.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M3 21h20M8 13.6V21M13 11.5V21M18 13.6V21" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/></svg>
      </div>
      <div>
        <div class="eyebrow">SkyBridge Healthcare</div>
        <h1>Vendor Management</h1>
      </div>
    </div>
    <div class="top-right">
      <button class="searchbtn" data-act="search" aria-label="Search everything"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg>Search<span class="kbd">Ctrl K</span></button>
      <div class="viewas">
        <span class="eyebrow">Viewing as</span>
        <select id="role" aria-label="Role">
          <option value="admin">SkyBridge admin</option>
          <option value="facility">Facility manager</option>
          <option value="vendor">Vendor</option>
        </select>
        <select id="as" aria-label="Which facility or vendor" hidden></select>
        <span class="qtip" tabindex="0" data-tip="Switching roles changes what's shown so you can see each side of the VMS. It isn't a login: anyone with the link can switch.">?</span>
      </div>
      <label class="switch" id="demo-switch"><input type="checkbox" id="demo-toggle"><span class="trk"></span>Sample data</label>
      <span class="chip" id="mode"><span class="dot"></span>Saved in this browser</span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="t-dash" aria-controls="p-dash">Dashboard</button>
    <button role="tab" id="t-reqs" aria-controls="p-reqs">Requisitions</button>
    <button role="tab" id="t-subs" aria-controls="p-subs">Submittals</button>
    <button role="tab" id="t-assign" aria-controls="p-assign">Assignments</button>
    <button role="tab" id="t-time" aria-controls="p-time">Time &amp; expenses</button>
    <button role="tab" id="t-inv" aria-controls="p-inv">Invoices</button>
    <button role="tab" id="t-reports" aria-controls="p-reports">Reports</button>

function isoDay(offset){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+offset); return isoOf(d); }
function addDays(iso, n){ const d = new Date(iso+"T12:00"); d.setDate(d.getDate()+n); return isoOf(d); }

function daysUntil(iso){ return iso ? daysBetween(today(), iso) : null; }
function lastSaturday(weeksBack=0){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() - ((d.getDay()+1)%7 || 7) - 7*weeksBack); return isoOf(d); }
function fmtD(iso){
  if(!iso) return "–";
  const d = new Date(iso.slice(0,10)+"T12:00");
  return d.toLocaleDateString("en-US", d.getFullYear()===new Date().getFullYear() ? {month:"short",day:"numeric"} : {month:"short",day:"numeric",year:"numeric"});
}
function fmtDT(local){
  if(!local) return "–";

}
function fmtAgo(iso){
  const m = Math.round((Date.now() - new Date(iso))/6e4);
  if(m<1) return "just now"; if(m<60) return m+" min ago";
  const h = Math.round(m/60); if(h<24) return h+" hr ago";
  const d = Math.round(h/24); return d<7 ? plural(d,"day")+" ago" : fmtD(iso);
}

  const R = [

    ["f2","Field team","RN","Hospice On-Call RN",3,24,13,40,92,1,"t1","pending",[]],
    ["f4","Field visits","LPN","Home Health LPN",4,26,13,25,60,1,"t1","pending",[]]
  ];
  const NAMES = ["Avery Coleman","Brianna Holt","Carlos Mendez","Danielle Price","Evan Fischer","Fatima Rahman","Grace Liu","Hector Alvarez","Imani Brooks","Jared Collins","Keisha Moore","Liam O'Connor","Maya Patel","Nathan Greer","Olivia Hart","Paulo Santos","Quinn Rivers","Rosa Delgado","Samuel Okoye","Tara Lindqvist","Uma Shah","Victor Ramos","Whitney Cole","Xavier Bryant","Yasmin Haddad","Zoe Mitchell","Aaron Pike","Bethany Rowe","Caleb Dunn","Diana Flores","Elijah Ward","Farah Nasser","Gavin Lowe","Hannah Brenner","Isaac Turner","Jasmine Ortiz","Kyle Morrison","Lauren Bishop"];
  const NOTES = ["8 yrs home health, OASIS-trained, own car.","Strong charting in HCHB. Available weekends.","Recent travel contract in a Level I trauma ED.","Bilingual English/Spanish. Prefers 13-week contracts.","Hospice-certified (CHPN). Comfortable with on-call."];

  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const reqs = [], subs = [], assigns = [], activity = [];
  // sample events dated today can't be later than now
  const act = (at, who, text, ref) => { const t = Math.min(new Date(at).getTime(), Date.now()-(activity.length%50+1)*6e4); activity.push({id:"x"+activity.length,at:new Date(t).toISOString(),who,text,...ref}); };
  const fName = id => facilities.find(f=>f.id===id).name, vName = id => vendors.find(v=>v.id===id).name;

/* =========================================================
   State + storage
   ========================================================= */
const blank = () => Object.fromEntries(COLS.map(c=>[c,[]]));
const S = {mode:"local", db:null, uid:null, admin:true, real:blank(), demo:null, demoPref:null, downloads:null, sample:null, role:SS.get("sbvms.role","admin"), as:SS.get("sbvms.as","")};
const hasReal = () => COLS.some(c=>c!=="activity" && S.real[c].length);
const demoOn = () => S.demoPref ?? !hasReal();
const D = () => demoOn() ? S.demo : S.real;
const byId = (col, id) => D()[col].find(x=>x.id===id);
function upsert(arr, doc){ const i = arr.findIndex(x=>x.id===doc.id); if(i<0) arr.push(doc); else arr[i] = doc; }

const Store = {
  async put(col, doc){
    if(demoOn()){ upsert(S.demo[col],doc); render(); return true; }
    if(S.mode==="shared"){
      try{ await S.db.doc(col+"/"+doc.id).set(doc); return true; }
      catch(e){ if(col!=="activity") toast("That change wasn't saved. Your access to this page may be view-only."); return false; }
    }
    if(col==="activity") S.real.activity = [doc,...S.real.activity].slice(0,500);
    else upsert(S.real[col],doc);
    LS.set("sbvms."+col,S.real[col]); render(); return true;
  },
  async del(col, id){
    if(demoOn()){ S.demo[col] = S.demo[col].filter(x=>x.id!==id); render(); return true; }
    if(S.mode==="shared"){
      try{ await S.db.doc(col+"/"+id).delete(); return true; }
      catch(e){ toast("That record wasn't deleted. Your access to this page may be view-only."); return false; }
    }
    S.real[col] = S.real[col].filter(x=>x.id!==id); LS.set("sbvms."+col,S.real[col]); render(); return true;
  }
};
// Every change leaves a line in the activity log, tagged so each facility and vendor sees only its own.
function log(text, ref={}){
  const e = {id:newId(),at:new Date().toISOString(),who:who(),text,...ref};
  if(demoOn()){ S.demo.activity.unshift(e); render(); } else Store.put("activity",e);
}

async function connect(){
  COLS.forEach(c=>{ S.real[c] = LS.get("sbvms."+c,[]); });
  render();
  if(!window.claude || !window.claude.use) return;
  try{
    claude.use("downloads").then(d=>{ S.downloads = d; }).catch(()=>{});
    claude.use("sample").then(fn=>{ S.sample = fn; render(); }).catch(()=>{});
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const [owner,edit] = await Promise.all([user.isOwner(), user.canEdit()]);
    Object.assign(S,{mode:"shared",db,uid,admin:owner||edit,real:blank()});
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{ S.real[c] = snap.docs.map(d=>d.data()); if(c==="activity") S.real.activity.sort((a,b)=>b.at.localeCompare(a.at)); render(); }, ()=>{}));
    render();
  }catch(e){ /* stay local */ }
}

function applyDist(q, dist, from=today()){
  q.release = dist==="all" ? 2 : 1;
  q.tier2At = /^d\d$/.test(dist) ? addDays(from, +dist.slice(1)) : "";
  q.dist = dist;
  return q;
}
const releaseNow = q => Math.max(q.release||0, q.tier2At && today()>=q.tier2At ? 2 : 0);
const openTo = (q, v) => !!v && v.status==="active" && q.status==="open" && v.tier <= releaseNow(q);
function ensureAs(){
  const d = D();
  if(S.role==="facility" && !d.facilities.some(f=>f.id===S.as)) S.as = d.facilities[0]?.id || "";
  if(S.role==="vendor" && !d.vendors.some(v=>v.id===S.as)) S.as = d.vendors[0]?.id || "";
  if((S.role==="facility" || S.role==="vendor") && !S.as) S.role = "admin";
}
const who = () => S.role==="facility" ? facName(S.as) : S.role==="vendor" ? venName(S.as) : "SkyBridge";
function scope(){
  const d = D();
  if(S.role==="facility"){
    const reqs = d.reqs.filter(q=>q.facilityId===S.as), rs = new Set(reqs.map(q=>q.id));
    const assigns = d.assigns.filter(a=>a.facilityId===S.as), as = new Set(assigns.map(a=>a.id));
    return {...d, reqs, subs:d.subs.filter(s=>rs.has(s.reqId)), assigns, timesheets:d.timesheets.filter(t=>as.has(t.assignId)),
      invoices:d.invoices.filter(i=>i.facilityId===S.as), activity:d.activity.filter(e=>e.facilityId===S.as)};
  }
  if(S.role==="vendor"){
    const v = d.vendors.find(x=>x.id===S.as);
    const subs = d.subs.filter(s=>s.vendorId===S.as), mine = new Set(subs.map(s=>s.reqId));
    const assigns = d.assigns.filter(a=>a.vendorId===S.as), as = new Set(assigns.map(a=>a.id));
    return {...d, reqs:d.reqs.filter(q=>mine.has(q.id) || openTo(q,v)), subs, assigns, timesheets:d.timesheets.filter(t=>as.has(t.assignId)),
      invoices:[], activity:d.activity.filter(e=>e.vendorId===S.as)};
  }
  return d;
}

const reqNo = q => q ? "REQ-"+q.no : "–";
const reqTitle = q => q ? `${q.discipline} · ${q.specialty}` : "Removed requisition";
const facName = id => byId("facilities",id)?.name || "Unknown facility";
const venName = id => byId("vendors",id)?.name || "Unknown vendor";
const accepted = q => D().subs.filter(s=>s.reqId===q.id && s.stage==="accepted").length;
const activeStage = s => !(s.stage in CLOSED);
const stageLabel = id => STAGES.find(s=>s.id===id)?.l || CLOSED[id] || id;
const nextStage = id => { const i = STAGES.findIndex(s=>s.id===id); return i>=0 && i<STAGES.length-1 ? STAGES[i+1].id : null; };
const lastMove = s => (s.history||[]).at(-1)?.at || s.submittedAt;
const nextNo = (col, start) => Math.max(start-1, ...D()[col].map(x=>x.no||0)) + 1;
const cardFor = (fid, disc) => byId("facilities",fid)?.rates?.[disc] || null;
const overCard = q => { const c = cardFor(q.facilityId,q.discipline); return !!(c && c.max && q.bill>c.max && (c.unit||"hour")===(q.billUnit||"hour")); };
const unitOf = q => q?.billUnit || q?.unit || "hour";
const estCost = q => q.bill*q.hours*q.weeks*q.openings;

function reqChip(q){
  return {open:`<span class="chip good"><span class="dot"></span>Open</span>`, filled:`<span class="chip brand"><span class="dot"></span>Filled</span>`,
    draft:`<span class="chip">${q.returnNote?"Sent back":"Draft"}</span>`, pending:`<span class="chip warn"><span class="dot"></span>Waiting for approval</span>`,
    hold:`<span class="chip warn"><span class="dot"></span>On hold</span>`, closed:`<span class="chip">Closed</span>`}[q.status] || esc(q.status);
}
function releaseLabel(q){
  if(q.status==="draft" || q.status==="pending" || !q.release) return "Not released";
  if(releaseNow(q)>=2) return "All tiers";
  return q.tier2At ? `Tier 1 · all tiers ${fmtD(q.tier2At)}` : "Tier 1 only";
}
function stageChip(s){
  const cls = s.stage==="accepted" ? "good" : s.stage in CLOSED ? "" : s.stage==="offer" ? "brand" : "warn";
  return `<span class="chip sm ${cls}">${esc(stageLabel(s.stage))}</span>`;
}
function dateState(iso, soon=30){
  if(!iso) return {cls:"bad",t:"Missing",n:-1e9};
  const n = daysUntil(iso);
  if(n<0) return {cls:"bad",t:`Expired ${fmtD(iso)}`,n};
  if(n<=soon) return {cls:"warn",t:`Expires in ${plural(n,"day")}`,n};
  return {cls:"good",t:`Valid to ${fmtD(iso)}`,n};
}
function credChips(a){
  return `<div class="creds">${CREDS.map(c=>{ const st = dateState(a.creds?.[c.id]); return `<span class="chip sm ${st.cls}" data-tip="${esc(c.l+": "+st.t)}">${esc(c.l)}</span>`; }).join("")}</div>`;
}
const credIssues = a => CREDS.filter(c=>dateState(a.creds?.[c.id]).cls!=="good");
const tasksLeft = a => ONBOARD.filter(o=>!a.tasks?.[o.id]);
// Cleared to start: every credential valid on the first day, and every onboarding task done.
const cleared = a => CREDS.every(c=>a.creds?.[c.id] && a.creds[c.id] >= (a.start>today()?a.start:today())) && !tasksLeft(a).length;
const isLive = a => a.status!=="cancelled" && a.status!=="ended" && a.end >= today();
function assignChip(a){
  if(a.status==="cancelled") return `<span class="chip">Cancelled</span>`;
  if(a.status==="ended" || a.end < today()) return `<span class="chip">Completed</span>`;
  if(a.start > today()) return cleared(a) ? `<span class="chip good"><span class="dot"></span>Cleared · starts ${fmtD(a.start)}</span>` : `<span class="chip warn"><span class="dot"></span>Not cleared · starts ${fmtD(a.start)}</span>`;
  return `<span class="chip good"><span class="dot"></span>Active</span>`;
}
function tsMath(t, a, mileRate){
  const unit = unitOf(a), total = sum(t.hours);
  const reg = unit==="visit" ? total : Math.min(total,OT_AFTER), ot = unit==="visit" ? 0 : Math.max(0,total-OT_AFTER);
  const bill = a?.bill || 0;
  const rateM = mileRate ?? (byId("facilities",a?.facilityId)?.mileage ?? DEFAULT_MILEAGE);
  const labor = reg*bill + ot*bill*OT_MULT, mileage = (+t.miles||0)*rateM, other = +t.other||0;
  return {unit, total, reg, ot, labor, miles:+t.miles||0, mileage, other, expenses:mileage+other, amount:labor+mileage+other};
}
function lineFor(t, a, mileRate){
  const m = tsMath(t,a,mileRate);
  return {tsId:t.id,worker:a.worker,title:a.title,vendorId:a.vendorId,discipline:a.discipline,week:t.week,unit:m.unit,reg:m.reg,ot:m.ot,bill:a.bill,labor:m.labor,miles:m.miles,mileage:m.mileage,other:m.other,otherDesc:t.otherDesc||"",amount:m.amount};
}
function totalInvoice(i){
  i.labor = sum(i.lines.map(l=>l.labor ?? l.amount));
  i.expenses = sum(i.lines.map(l=>(l.mileage||0)+(l.other||0)));
  i.total = i.labor + i.expenses;
  return i;
}
const feeOf = i => (i.labor ?? i.total)*(i.feePct||0)/100;
// The VMS fee comes out of labor only; expenses pass through to the vendor in full.
function vendorShare(i, vid){
  const ls = i.lines.filter(l=>!vid || l.vendorId===vid);
  return sum(ls.map(l=>(l.labor ?? l.amount)*(1-(i.feePct||0)/100) + (l.mileage||0) + (l.other||0)));
}
function tsChip(t){
  if(t.invoiceId) return `<span class="chip sm brand">Invoiced</span>`;
  return {submitted:`<span class="chip sm warn">Waiting for approval</span>`, approved:`<span class="chip sm good">Approved</span>`, rejected:`<span class="chip sm bad">Sent back</span>`}[t.status] || "";
}
function invChip(i){ return {draft:`<span class="chip sm">Draft</span>`, sent:`<span class="chip sm warn">Sent</span>`, paid:`<span class="chip sm good">Paid</span>`}[i.status] || ""; }
const unitsTxt = (n, unit) => unit==="visit" ? plural(n,"visit") : `${n} hrs`;

function aiError(e){
  return {not_granted:"Claude wasn't allowed for this page, so it can't help here.", rate_limited:"Too many requests right now. Try again in a minute.", cancelled:""}[e?.code] ?? "Claude couldn't answer that. Try again.";
}
async function aiStream(prompt, out, btn){
  if(!S.sample) return;
  btn && (btn.disabled = true);
  out.hidden = false; out.innerHTML = `<span class="spin"></span> Thinking…`;
  try{
    const {text} = await S.sample(prompt,{onText:({text})=>{ out.textContent = text; }});
    out.textContent = text;
  }catch(e){ out.textContent = e?.text || aiError(e); }
  finally{ btn && (btn.disabled = false); }
}

function allowedTabs(){
  if(S.role==="vendor") return ["dash","reqs","subs","assign","time"];
  if(S.role==="facility") return ["dash","reqs","subs","assign","time","inv","reports"];

function renderDash(){

  if(!D().facilities.length && !D().vendors.length){
    el.innerHTML = `<div class="card">${empty("Set up your first facility and vendor","Add the facilities that post openings and the agencies that submit clinicians. Then post a requisition.",`<button class="btn" data-act="go" data-tab="partners">Add facilities and vendors</button>`)}</div>`;

  }
  const live = sc.reqs.filter(q=>q.status==="open");

  const totalPos = sum(counted.map(q=>q.openings)), filledPos = sum(counted.map(q=>Math.min(q.openings,accepted(q))));
  const fill = totalPos ? Math.round(filledPos/totalPos*100) : 0;

  const starting = sc.assigns.filter(a=>isLive(a) && a.start>today()).length;

  else tiles.push({tab:"subs",e:"Submittals to review",v:sc.subs.filter(s=>s.stage==="submitted").length,s:`${sc.subs.filter(s=>s.stage==="interview").length} in interview`});
  tiles.push({tab:"assign",e:"Clinicians working",v:working,s:`${starting} starting soon`});
  if(can.approveTime()) tiles.push({tab:"time",e:"Timesheets to approve",v:sc.timesheets.filter(t=>t.status==="submitted").length,s:"submitted by vendors"});
  else tiles.push({tab:"time",e:"Timesheets sent back",v:sc.timesheets.filter(t=>t.status==="rejected").length,s:"need a fix"});
  if(S.role==="vendor"){
    const earned = sum(D().invoices.filter(i=>i.createdAt.startsWith(month)).map(i=>vendorShare(i,S.as)));
    tiles.push({tab:"time",e:"Earned this month",v:usd0(earned),s:"after the VMS fee"});
  } else {
    const billed = sum(sc.invoices.filter(i=>i.createdAt.startsWith(month)).map(i=>i.total));
    tiles.push({tab:"inv",e:"Billed this month",v:usd0(billed),s:`${usd0(sum(sc.invoices.filter(i=>i.status==="sent").map(i=>i.total)))} awaiting payment`});
  }

  // what needs attention, worst first
  const items = [];
  if(can.approve()) sc.reqs.filter(q=>q.status==="pending").forEach(q=>items.push({sev:"warn",rank:-50,html:`<b>${esc(reqNo(q))}</b> is waiting for your approval${overCard(q)?" (over the rate card)":""}<span class="sub2">${esc(reqTitle(q))} at ${esc(facName(q.facilityId))} · ${usd0(estCost(q))} estimated</span>`,act:"req-view",id:q.id}));
  if(S.role==="facility") sc.reqs.filter(q=>q.status==="draft" && q.returnNote).forEach(q=>items.push({sev:"warn",rank:-40,html:`<b>${esc(reqNo(q))}</b> was sent back: ${esc(q.returnNote)}`,act:"req-view",id:q.id}));
  sc.assigns.filter(isLive).forEach(a=>credIssues(a).forEach(c=>{
    const st = dateState(a.creds?.[c.id]);
    items.push({sev:st.cls==="bad"?"bad":"warn",rank:st.n,html:`<b>${esc(a.worker)}</b>: ${esc(c.l)} ${!a.creds?.[c.id] ? "is missing" : esc(lower1(st.t))}<span class="sub2">${esc(a.title)} at ${esc(facName(a.facilityId))}</span>`,act:"asg-onboard",id:a.id});
  }));
  sc.assigns.filter(a=>isLive(a) && a.start>today() && tasksLeft(a).length).forEach(a=>items.push({sev:daysUntil(a.start)<=7?"bad":"warn",rank:daysUntil(a.start),html:`<b>${esc(a.worker)}</b> starts ${fmtD(a.start)} with ${plural(tasksLeft(a).length,"onboarding task")} open<span class="sub2">${esc(tasksLeft(a).map(t=>t.l).join(", "))}</span>`,act:"asg-onboard",id:a.id}));
  sc.reqs.filter(q=>q.status==="open").forEach(q=>{
    const n = daysUntil(q.start), subs = D().subs.filter(s=>s.reqId===q.id && activeStage(s)).length;

  });
  sc.subs.filter(s=>activeStage(s) && s.stage!=="accepted").forEach(s=>{

  });
  if(can.review()) sc.subs.filter(s=>s.stage==="interview" && s.interview?.at && new Date(s.interview.at)<new Date() && !s.feedback).forEach(s=>items.push({sev:"info",rank:1,html:`Add interview feedback for <b>${esc(s.cand.name)}</b><span class="sub2">Interviewed ${esc(fmtDT(s.interview.at))}</span>`,act:"sub-feedback",id:s.id}));

    }).filter(Boolean).sort((a,b)=>b.hires-a.hires || b.iv-a.iv);

      </tbody></table></div>` : `<p class="muted small">No submittals yet.</p>`}

  }

  el.innerHTML = `
    <div class="head-row"><div><h2>Dashboard</h2><p class="muted small">${esc(scopeLabel())} · ${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</p></div></div>
    <div class="kpis">${tiles.map(t=>`<button class="kpi" data-act="go" data-tab="${t.tab}"><span class="eyebrow">${esc(t.e)}</span><span class="v">${t.v}</span><span class="s">${esc(t.s)}</span>${t.meter!=null?`<span class="meter"><span style="width:${t.meter}%"></span></span>`:""}</button>`).join("")}</div>
    <div class="split">
      <div class="card stack-s">
        <h3>Needs attention</h3>
        ${items.length ? `<div class="alist">${items.slice(0,10).map(i=>`<div class="aitem"><span class="sev ${i.sev}" aria-hidden="true"></span><div>${i.html}</div>${itemBtn(i)}</div>`).join("")}</div>${items.length>10?`<p class="muted tiny">And ${items.length-10} more.</p>`:""}` : `<p class="muted small">Nothing needs attention right now.</p>`}
      </div>
      <div class="stack">
        <div class="card stack">
          <div><h3>Candidate pipeline</h3><p class="muted small">Submittals by stage, not counting declined or withdrawn.</p></div>
          <div class="hbars">${counts.map(c=>`<div class="hbar"><span>${esc(c.l)}</span><span class="trk"><span style="width:${c.n/maxN*100}%"></span></span><span class="val">${c.n}</span></div>`).join("")}</div>
        </div>
        <div class="card stack-s">
          <h3>Interviews this week</h3>
          ${upcoming.length ? `<div class="feed">${upcoming.map(s=>{ const q = byId("reqs",s.reqId); return `<div><span><span class="who">${esc(s.cand.name)}</span> · ${esc(s.interview.mode)}<span class="sub2">${esc(reqNo(q))} · ${esc(reqTitle(q))}${S.role!=="facility"?" · "+esc(facName(q?.facilityId)):""}</span></span><time>${esc(fmtDT(s.interview.at))}</time></div>`; }).join("")}</div>` : `<p class="muted small">No interviews scheduled in the next 7 days.</p>`}
        </div>
      </div>
    </div>
    ${score}`;
}

function renderReqs(){
  const sc = scope(), el = $("p-reqs");
  const statuses = S.role==="vendor" ? [["open","Open"],["all","All"]] : [["open","Open"],["pending","Waiting for approval"],["filled","Filled"],["hold","On hold"],["draft","Draft"],["closed","Closed"],["all","All"]];
  if(!statuses.some(s=>s[0]===F.reqStatus)) F.reqStatus = "open";
  const q = norm(F.reqQ);
  const list = sc.reqs
    .filter(r=>F.reqStatus==="all" || r.status===F.reqStatus)
    .filter(r=>!F.reqDisc || r.discipline===F.reqDisc)
    .filter(r=>!q || norm(`${reqNo(r)} ${reqTitle(r)} ${facName(r.facilityId)} ${r.unit}`).includes(q))
    .sort((a,b)=>a.start.localeCompare(b.start));
  const countOf = s => sc.reqs.filter(r=>s==="all" || r.status===s).length;
  const v = S.role==="vendor" ? byId("vendors",S.as) : null;
  el.innerHTML = `
    <div class="head-row">
      <div><h2>Requisitions</h2><p class="muted small">${S.role==="vendor" ? `Openings released to ${esc(v?.name||"you")} (Tier ${v?.tier||"–"}), plus any you've submitted to.` : S.role==="facility" ? "Post openings for SkyBridge to approve and send to vendors." : "Approve what facilities post, then release to Tier 1 first and all tiers on a schedule."}</p></div>
      ${can.postReq() ? `<button class="btn" data-act="req-new">Post requisition</button>` : ""}
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Status">${statuses.filter(([id])=>id==="open"||id==="all"||countOf(id)).map(([id,l])=>`<button data-act="f" data-k="reqStatus" data-v="${id}" aria-pressed="${F.reqStatus===id}">${l} · ${countOf(id)}</button>`).join("")}</div>
      <span class="spacer"></span>
      <select id="req-disc" aria-label="Discipline"><option value="">All disciplines</option>${DISCIPLINES.map(d=>`<option${F.reqDisc===d?" selected":""}>${d}</option>`).join("")}</select>
      <input type="search" id="req-q" placeholder="Search req #, specialty, facility" value="${esc(F.reqQ)}" aria-label="Search requisitions">
    </div>
    <div class="card" style="padding:6px 10px">
      ${list.length ? `<div class="tbl"><table><thead><tr><th>Req</th><th>Position</th><th>Start</th><th>Schedule</th><th class="n">Bill rate</th><th class="n">Filled</th><th class="n">Candidates</th><th>Release</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.map(r=>{
        const subs = D().subs.filter(s=>s.reqId===r.id && activeStage(s));
        const mine = S.role==="vendor" ? subs.filter(s=>s.vendorId===S.as).length : null;
        const n = daysUntil(r.start);
        return `<tr class="click" data-act="req-view" data-id="${esc(r.id)}">
          <td class="mono">${esc(reqNo(r))}</td>
          <td><b>${esc(reqTitle(r))}</b><span class="sub2">${esc(facName(r.facilityId))} · ${esc(r.unit)}</span></td>
          <td class="nw">${fmtD(r.start)}${r.status==="open" && n>=0 && n<=14 ? `<span class="sub2">in ${plural(n,"day")}</span>`:""}</td>
          <td class="nw">${esc(r.shift)}<span class="sub2">${r.hours} ${unitOf(r)==="visit"?"visits":"hrs"}/wk · ${r.weeks} wks</span></td>
          <td class="n">${rateU(r.bill,unitOf(r))}${S.role!=="vendor" && overCard(r) ? `<span class="sub2" style="color:var(--warn)">over rate card</span>` : ""}</td>
          <td class="n">${accepted(r)}/${r.openings}</td>
          <td class="n">${mine!=null ? `${mine} yours` : subs.length}</td>
          <td class="nw">${esc(releaseLabel(r))}</td>
          <td>${reqChip(r)}</td>
          <td><div class="acts">${S.role==="vendor" && openTo(r,v) ? `<button class="btn sm" data-act="sub-new" data-req="${esc(r.id)}">Submit</button>` : can.approve() && r.status==="pending" ? `<button class="btn sm" data-act="req-approve" data-id="${esc(r.id)}">Review</button>` : `<button class="btn sm ghost" data-act="req-view" data-id="${esc(r.id)}">View</button>`}</div></td>
        </tr>`;}).join("")}
      </tbody></table></div>` : empty(sc.reqs.length ? "No requisitions match" : "No requisitions yet", sc.reqs.length ? "Try a different status, discipline or search." : (can.postReq() ? "Post the first opening and release it to your vendors." : "When a facility releases an opening to your tier, it shows up here."))}
    </div>`;
  $("req-q").addEventListener("input",e=>{ F.reqQ = e.target.value; renderTab(); });
  $("req-disc").addEventListener("change",e=>{ F.reqDisc = e.target.value; renderTab(); });
}

function reqForm(r){

  const draftable = isNew || ["draft","pending"].includes(r.status);
  openDialog(isNew ? "Post a requisition" : `Edit ${reqNo(r)}`, `

    ${S.sample ? `<details class="ai" id="rf-ai-box"><summary class="ai-tag" style="cursor:pointer">${ICON_AI} Fill from a job posting</summary>
      <textarea id="rf-paste" placeholder="Paste the posting or the client's email. Claude fills in the form below, and you check it before posting."></textarea>

    <div class="fgrid">
      <label class="f">Facility<select name="facilityId" id="rf-fac" ${S.role==="facility"?"disabled":""}>${d.facilities.map(x=>`<option value="${esc(x.id)}"${x.id===r.facilityId?" selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
      <label class="f">Unit or team<input type="text" name="unit" id="rf-unit" required value="${esc(r.unit)}" list="rf-units" placeholder="Field visits"><datalist id="rf-units">${(f?.units||[]).map(u=>`<option value="${esc(u)}">`).join("")}</datalist></label>
      <label class="f">Discipline<select name="discipline" id="rf-disc">${DISCIPLINES.map(x=>`<option${x===r.discipline?" selected":""}>${x}</option>`).join("")}</select></label>
      <label class="f">Specialty<input type="text" name="specialty" id="rf-spec" required value="${esc(r.specialty)}" placeholder="Home Health Case Manager"></label>
      <label class="f">Shift<select name="shift" id="rf-shift">${SHIFTS.map(x=>`<option${x===r.shift?" selected":""}>${x}</option>`).join("")}</select></label>
      <label class="f">Start date<input type="date" name="start" id="rf-start" required value="${esc(r.start)}"></label>
      <label class="f">Length (weeks)<input type="number" name="weeks" id="rf-weeks" required min="1" max="52" value="${esc(r.weeks)}"></label>
      <label class="f">Billed<select name="billUnit" id="rf-unit-b">${Object.entries(UNITS).map(([k,u])=>`<option value="${k}"${k===unitOf(r)?" selected":""}>${u.l}</option>`).join("")}</select></label>
      <label class="f"><span id="rf-hours-l">Guaranteed ${unitOf(r)==="visit"?"visits":"hours"} per week</span><input type="number" name="hours" id="rf-hours" required min="1" max="84" value="${esc(r.hours)}"></label>
      <label class="f">Bill rate ($)<input type="number" name="bill" id="rf-bill" required min="1" step="0.01" value="${esc(r.bill)}" placeholder="78.00"></label>
      <label class="f">Openings<input type="number" name="openings" id="rf-open" required min="1" max="50" value="${esc(r.openings)}"></label>
      ${S.role==="admin" && (isNew || r.status==="draft") ? `<label class="f">Send to vendors<select name="dist" id="rf-dist">${DIST.map(([k,l])=>`<option value="${k}"${k===(r.dist||"d2")?" selected":""}>${l}</option>`).join("")}</select></label>` : ""}
      <p class="small wide" id="rf-card"></p>
      <label class="f wide" id="rf-just-l" hidden>Why the rate is above the rate card<textarea name="justification" id="rf-just" placeholder="Market rate, hard-to-fill shift, urgent start…">${esc(r.justification)}</textarea></label>
      <label class="f wide">Notes for vendors<textarea name="notes" id="rf-notes" placeholder="Float policy, EMR, visit productivity, parking…">${esc(r.notes)}</textarea></label>
      ${draftable ? `<label class="row small wide" style="gap:8px"><input type="checkbox" name="asDraft" id="rf-draft" ${r.status==="draft" && !isNew?"checked":""}>Save as a draft for now</label>` : ""}
    </div>`,
    isNew ? (S.role==="facility" ? "Submit for approval" : "Post requisition") : "Save changes",
    async fd=>{
      const facilityId = S.role==="facility" ? S.as : fd.facilityId;
      const fac = byId("facilities",facilityId);
      const doc = {...(isNew ? {id:newId(),no:nextNo("reqs",1001),createdAt:today(),release:0,tier2At:""} : r),
        facilityId, setting:fac?.setting||"", unit:fd.unit.trim(), discipline:fd.discipline, specialty:fd.specialty.trim(), shift:fd.shift,
        start:fd.start, weeks:+fd.weeks, hours:+fd.hours, billUnit:fd.billUnit, bill:+fd.bill, openings:+fd.openings, notes:fd.notes.trim(), justification:(fd.justification||"").trim()};
      if(overCard(doc) && !doc.justification) return "Explain why the bill rate is above the rate card. SkyBridge sees this when approving.";
      let msg;
      if(draftable){
        delete doc.returnNote;
        if(fd.asDraft){ doc.status = "draft"; msg = `${reqNo(doc)} saved as a draft`; }
        else if(S.role==="facility"){ doc.status = "pending"; msg = `${reqNo(doc)} sent to SkyBridge for approval`; }
        else { doc.status = "open"; applyDist(doc, fd.dist||"d2"); msg = `${reqNo(doc)} posted and sent to ${releaseLabel(doc).toLowerCase()}`; }
      } else msg = `${reqNo(doc)} saved`;
      if(await Store.put("reqs",doc)){ toast(msg); log(isNew ? (doc.status==="pending" ? `Submitted ${reqNo(doc)} (${reqTitle(doc)}) for approval` : doc.status==="open" ? `Posted ${reqNo(doc)} (${reqTitle(doc)})` : `Drafted ${reqNo(doc)}`) : doc.status==="pending" && r.status==="draft" ? `Resubmitted ${reqNo(doc)} for approval` : `Edited ${reqNo(doc)}`, {col:"reqs",id:doc.id,facilityId}); }
    });
  const sync = () => {
    const fid = S.role==="facility" ? S.as : $("rf-fac").value, disc = $("rf-disc").value;
    const card = cardFor(fid,disc), unit = $("rf-unit-b").value, bill = +$("rf-bill").value;
    $("rf-hours-l").textContent = `Guaranteed ${unit==="visit"?"visits":"hours"} per week`;
    const over = card && card.max && (card.unit||"hour")===unit && bill>card.max;
    $("rf-card").innerHTML = card ? `Rate card for ${esc(disc)} at ${esc(facName(fid))}: target ${rateU(card.target,card.unit)}, max ${rateU(card.max,card.unit)}.${over?` <b style="color:var(--warn)">This is ${usd(bill-card.max)} over the max.</b>`:""}` : `<span class="muted">No rate card for ${esc(disc)} at this facility yet.</span>`;
    $("rf-just-l").hidden = !over;
  };
  const applyCard = () => {
    const fid = S.role==="facility" ? S.as : $("rf-fac").value, card = cardFor(fid,$("rf-disc").value);
    if(card){ $("rf-unit-b").value = card.unit||"hour"; if(!$("rf-bill").value || isNew) $("rf-bill").value = card.target; }
    sync();
  };
  $("rf-fac")?.addEventListener("change",e=>{ const fx = byId("facilities",e.target.value); $("rf-units").innerHTML = (fx?.units||[]).map(u=>`<option value="${esc(u)}">`).join(""); applyCard(); });
  $("rf-disc").addEventListener("change",applyCard);
  ["rf-bill","rf-unit-b"].forEach(id=>$(id).addEventListener("input",sync));
  if(isNew) applyCard(); else sync();
}

async function parsePosting(){
  const text = $("rf-paste")?.value.trim(), msg = $("rf-ai-msg");
  if(!text){ msg.className = "msg bad"; msg.textContent = "Paste a posting first."; return; }
  if(!S.sample) return;
  msg.className = "msg"; msg.innerHTML = `<span class="spin"></span> Reading the posting…`;
  const facs = D().facilities.map(f=>f.name);
  const prompt = `You extract healthcare staffing requisitions from job postings. Today is ${today()}.
Return only a JSON object with these keys (use null for anything the posting doesn't say):
facility (one of: ${JSON.stringify(facs)}, or null), unit (string), discipline (one of ${JSON.stringify(DISCIPLINES)}), specialty (short string),
shift (one of ${JSON.stringify(SHIFTS)}), start (YYYY-MM-DD), weeks (number), billUnit ("hour" or "visit"), hours (guaranteed hours or visits per week, number),
bill (bill rate number, no $), openings (number), notes (one or two sentences of requirements vendors need to know).

Posting:
${text}`;
  try{
    const r = await S.sample.json(prompt);
    const set = (id, v) => { if(v!=null && v!=="" && $(id)) $(id).value = v; };
    if(r.facility && S.role!=="facility"){ const f = D().facilities.find(x=>x.name===r.facility); if(f){ $("rf-fac").value = f.id; $("rf-fac").dispatchEvent(new Event("change")); } }
    if(DISCIPLINES.includes(r.discipline)){ $("rf-disc").value = r.discipline; $("rf-disc").dispatchEvent(new Event("change")); }
    if(SHIFTS.includes(r.shift)) $("rf-shift").value = r.shift;
    if(r.billUnit in UNITS) $("rf-unit-b").value = r.billUnit;
    set("rf-unit",r.unit); set("rf-spec",r.specialty); set("rf-weeks",r.weeks); set("rf-hours",r.hours); set("rf-bill",r.bill); set("rf-open",r.openings); set("rf-notes",r.notes);
    if(/^\d{4}-\d{2}-\d{2}$/.test(r.start||"")) $("rf-start").value = r.start;
    $("rf-bill").dispatchEvent(new Event("input"));
    msg.className = "msg good"; msg.textContent = "Filled in. Check each field before posting.";
  }catch(e){ msg.className = "msg bad"; msg.textContent = aiError(e) || "Stopped."; }
}

function renderSubs(){
  const sc = scope(), el = $("p-subs");
  const q = norm(F.subQ);
  const facs = [...new Set(sc.subs.map(s=>byId("reqs",s.reqId)?.facilityId).filter(Boolean))];
  if(F.subFac && !facs.includes(F.subFac)) F.subFac = "";
  const list = sc.subs.filter(s=>{
    const r = byId("reqs",s.reqId);
    if(F.subFac && r?.facilityId!==F.subFac) return false;
    return !q || norm(`${s.cand.name} ${reqNo(r)} ${reqTitle(r)} ${venName(s.vendorId)} ${facName(r?.facilityId)}`).includes(q);
  });
  const closed = list.filter(s=>!activeStage(s));
  el.innerHTML = `
    <div class="head-row">
      <div><h2>Submittals</h2><p class="muted small">${can.review() ? "Move candidates through the stages. Scheduling an interview and accepting an offer each take one click." : "Track your candidates. Withdraw anyone who's no longer available."}</p></div>
      ${can.submit() ? `<button class="btn" data-act="sub-new">Submit a candidate</button>` : ""}
    </div>
    <div class="toolbar">
      ${S.role!=="facility" && facs.length>1 ? `<select id="sub-fac" aria-label="Facility"><option value="">All facilities</option>${facs.map(f=>`<option value="${esc(f)}"${F.subFac===f?" selected":""}>${esc(facName(f))}</option>`).join("")}</select>` : ""}
      <input type="search" id="sub-q" placeholder="Search candidate, req #, vendor" value="${esc(F.subQ)}" aria-label="Search submittals">
    </div>
    ${sc.subs.length ? `<div class="board">${STAGES.map(st=>{
      const cards = list.filter(s=>s.stage===st.id).sort((a,b)=>st.id==="interview" ? String(a.interview?.at).localeCompare(String(b.interview?.at)) : lastMove(a).localeCompare(lastMove(b)));
      return `<section class="col" aria-label="${esc(st.l)}"><header><b>${esc(st.l)}</b><span class="count">${cards.length}</span></header>
        ${cards.length ? cards.map(subCard).join("") : `<p class="none">No one here.</p>`}</section>`;
    }).join("")}</div>
    ${closed.length ? `<details class="card" style="padding:14px 16px"><summary class="small" style="cursor:pointer;font-weight:600">Declined and withdrawn · ${closed.length}</summary>
      <div class="tbl" style="margin-top:8px"><table><tbody>${closed.map(s=>{ const r = byId("reqs",s.reqId); return `<tr><td><b>${esc(s.cand.name)}</b><span class="sub2">${esc(reqNo(r))} · ${esc(reqTitle(r))}</span></td><td>${esc(venName(s.vendorId))}</td><td>${stageChip(s)}</td><td class="nw">${fmtD(lastMove(s))}</td></tr>`; }).join("")}</tbody></table></div></details>` : ""}`
    : `<div class="card">${empty("No submittals yet", can.submit() ? "Submit a candidate to an open requisition to get started." : "Vendors' candidates for your openings will show up here.")}</div>`}`;
  $("sub-q").addEventListener("input",e=>{ F.subQ = e.target.value; renderTab(); });
  $("sub-fac")?.addEventListener("change",e=>{ F.subFac = e.target.value; renderTab(); });
}
function subCard(s){
  const r = byId("reqs",s.reqId), unit = unitOf(r);
  const days = daysBetween(lastMove(s),today());
  const over = r && s.rate>r.bill;
  const nx = nextStage(s.stage);
  const btns = [];
  if(can.review() && nx){
    if(nx==="interview") btns.push(`<button class="btn sm" data-act="sub-interview" data-id="${esc(s.id)}">Schedule interview</button>`);
    else btns.push(`<button class="btn sm${nx==="accepted"?" good":""}" data-act="sub-move" data-id="${esc(s.id)}" data-v="${nx}">${nx==="accepted" ? "Accept offer" : nx==="offer" ? "Make offer" : "Move to "+stageLabel(nx).toLowerCase()}</button>`);
  }
  if(can.review() && s.stage==="interview") btns.push(`<button class="btn sm ghost" data-act="sub-feedback" data-id="${esc(s.id)}">${s.feedback?"Edit feedback":"Add feedback"}</button>`);
  if(can.review() && s.stage!=="accepted") btns.push(`<button class="btn sm quiet" data-act="sub-move" data-id="${esc(s.id)}" data-v="declined">Decline</button>`);
  if(S.role==="vendor" && s.stage!=="accepted") btns.push(`<button class="btn sm quiet" data-act="sub-move" data-id="${esc(s.id)}" data-v="withdrawn">Withdraw</button>`);
  return `<article class="scard">
    <span class="nm">${esc(s.cand.name)}</span>
    <span class="ln">${esc(reqNo(r))} · ${esc(reqTitle(r))}<br>${esc(facName(r?.facilityId))}</span>
    ${S.role!=="vendor" ? `<span class="ln">${esc(venName(s.vendorId))}</span>` : ""}
    ${s.stage==="interview" && s.interview ? `<span class="chip sm brand" style="white-space:normal">${esc(fmtDT(s.interview.at))} · ${esc(s.interview.mode)}</span>` : ""}
    <div class="row"><span class="chip sm ${over?"warn":""}" ${over?`data-tip="${esc(`${usd(s.rate-r.bill)} over the ${rateU(r.bill,unit)} bill rate`)}"`:""}>${rateU(s.rate,unit)}</span><span class="chip sm">${s.cand.years} yrs</span>${s.feedback?`<span class="chip sm ${s.feedback.score>=4?"good":"warn"}" data-tip="${esc(s.feedback.note||"")}">Interview ${s.feedback.score}/5</span>`:""}<span class="tiny muted">${days===0?"today":plural(days,"day")+" here"}</span></div>
    ${btns.length ? `<div class="row">${btns.join("")}</div>` : ""}
  </article>`;
}

  openDialog("Submit a candidate", `
    <div class="fgrid">
      <label class="f wide">Requisition<select name="reqId" id="sf-req">${reqs.map(r=>`<option value="${esc(r.id)}"${r.id===r0.id?" selected":""}>${esc(reqNo(r))} · ${esc(reqTitle(r))} · ${esc(facName(r.facilityId))}</option>`).join("")}</select></label>
      ${S.role==="admin" ? `<label class="f wide">On behalf of<select name="vendorId" id="sf-ven">${eligible(r0).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (Tier ${x.tier})</option>`).join("")}</select></label>` : ""}
      <label class="f">Candidate name<input type="text" name="name" id="sf-name" required autocomplete="off"></label>

      <label class="f">License number<input type="text" name="lic" id="sf-lic" required autocomplete="off" placeholder="RN.123456"></label>
      <label class="f"><span id="sf-rate-l">Proposed bill rate ($/${UNITS[unitOf(r0)].u})</span><input type="number" name="rate" id="sf-rate" required min="1" step="0.01" value="${r0.bill}"></label>
      <label class="f">Available from<input type="date" name="avail" id="sf-avail" required value="${esc(r0.start)}"></label>
      <p class="msg warn wide" id="sf-rate-msg" hidden></p>
      <label class="f wide">Notes for the facility<textarea name="notes" id="sf-notes" placeholder="Experience, EMR, certifications, availability…"></textarea></label>
    </div>`,
    "Submit candidate",
    async fd=>{
      const r = byId("reqs",fd.reqId);
      const vendorId = S.role==="vendor" ? S.as : fd.vendorId;
      if(!vendorId) return "Pick the vendor you're submitting for.";
      const dup = d.subs.find(s=>s.reqId===r.id && s.stage!=="withdrawn" && (norm(s.cand.lic)===norm(fd.lic) || norm(s.cand.name)===norm(fd.name)));
      if(dup) return `${dup.cand.name} is already submitted to ${reqNo(r)}${S.role==="vendor" && dup.vendorId!==S.as ? " by another vendor" : " by "+venName(dup.vendorId)}. A candidate can be submitted to a requisition once.`;
      const s = {id:newId(),reqId:r.id,vendorId,cand:{name:fd.name.trim(),state:fd.state.trim().toUpperCase(),lic:fd.lic.trim(),years:+fd.years},
        rate:+fd.rate,avail:fd.avail,notes:fd.notes.trim(),stage:"submitted",submittedAt:today(),history:[{stage:"submitted",at:today()}]};
      if(await Store.put("subs",s)){ toast(`${s.cand.name} submitted to ${reqNo(r)}`); log(`Submitted ${s.cand.name} to ${reqNo(r)}`,{col:"subs",id:s.id,facilityId:r.facilityId,vendorId}); }
    });
  const check = () => {
    const r = byId("reqs",$("sf-req").value), v2 = +$("sf-rate").value, m = $("sf-rate-msg");
    m.hidden = !(r && v2>r.bill);

  };
  $("sf-rate").addEventListener("input",check);
  $("sf-req").addEventListener("change",()=>{
    const r = byId("reqs",$("sf-req").value);
    $("sf-rate").value = r.bill; $("sf-avail").value = r.start; $("sf-rate-l").textContent = `Proposed bill rate ($/${UNITS[unitOf(r)].u})`;
    if($("sf-ven")) $("sf-ven").innerHTML = eligible(r).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (Tier ${x.tier})</option>`).join("");
    check();
  });
}

async function moveSub(id, stage, extra={}){
  const s = byId("subs",id); if(!s) return false;
  const r = byId("reqs",s.reqId);
  const doc = {...s, ...extra, stage, history:[...(s.history||[]),{stage,at:today()}]};
  if(!await Store.put("subs",doc)) return false;
  const ref = {col:"subs",id:s.id,facilityId:r?.facilityId,vendorId:s.vendorId};
  if(stage!=="accepted"){
    log(stage==="interview" ? `Scheduled ${s.cand.name}'s interview for ${fmtDT(extra.interview?.at)} (${reqNo(r)})` : stage in CLOSED ? `${CLOSED[stage]} ${s.cand.name} on ${reqNo(r)}` : `Moved ${s.cand.name} to ${stageLabel(stage).toLowerCase()} on ${reqNo(r)}`, ref);
    toast(stage==="interview" ? `Interview scheduled for ${s.cand.name}` : `${s.cand.name}: ${stageLabel(stage).toLowerCase()}`);
    return true;
  }
  const start = r.start < today() ? today() : r.start;
  const a = {id:newId(),subId:s.id,reqId:r.id,facilityId:r.facilityId,vendorId:s.vendorId,worker:s.cand.name,discipline:r.discipline,title:reqTitle(r),
    start,end:addDays(start,r.weeks*7-1),bill:s.rate,unit:unitOf(r),hours:r.hours,status:"booked",creds:{},tasks:{}};
  await Store.put("assigns",a);
  const filled = D().subs.filter(x=>x.reqId===r.id && x.stage==="accepted" && x.id!==s.id).length + 1;
  if(filled>=r.openings && r.status==="open") await Store.put("reqs",{...r,status:"filled"});
  log(`Accepted ${s.cand.name}'s offer and booked them on ${reqNo(r)} starting ${fmtD(start)}`, ref);
  toast(`${s.cand.name} is booked. Finish onboarding on the Assignments tab.`);
  return true;
}

async function makeInvoices(){

  for(const [fid,rows] of Object.entries(groups)){

function periodStart(p){
  const d = new Date();
  if(p==="month") return today().slice(0,8)+"01";
  if(p==="quarter") return `${d.getFullYear()}-${pad(Math.floor(d.getMonth()/3)*3+1)}-01`;
  if(p==="ytd") return `${d.getFullYear()}-01-01`;
  return "";
}
function renderReports(){
  const sc = scope(), el = $("p-reports");
  const from = periodStart(F.period), year = `${new Date().getFullYear()}-01-01`;
  const invs = sc.invoices.filter(i=>i.createdAt>=from);
  const lines = invs.flatMap(i=>i.lines.map(l=>({...l,facilityId:i.facilityId,feePct:i.feePct,invNo:i.no,createdAt:i.createdAt})));
  const spend = sum(invs.map(i=>i.total)), labor = sum(invs.map(i=>i.labor ?? i.total)), exp = spend-labor, fees = sum(invs.map(feeOf));
  const hours = sum(lines.filter(l=>(l.unit||"hour")==="hour").map(l=>l.reg+l.ot)), visits = sum(lines.filter(l=>l.unit==="visit").map(l=>l.reg));
  const group = (key, name) => {
    const m = {}; lines.forEach(l=>{ const k = l[key]; m[k] = (m[k]||0) + l.amount; });
    return Object.entries(m).map(([k,v])=>({k,l:name(k),v})).sort((a,b)=>b.v-a.v);
  };
  const bars = (rows) => { const mx = Math.max(1,...rows.map(r=>r.v)); return rows.length ? `<div class="hbars">${rows.map(r=>`<div class="hbar" style="grid-template-columns:minmax(0,170px) minmax(0,1fr) 92px"><span>${esc(r.l)}</span><span class="trk"><span style="width:${r.v/mx*100}%"></span></span><span class="val">${usd0(r.v)}</span></div>`).join("")}</div>` : `<p class="muted small">No invoiced spend in this period.</p>`; };
  const facs = S.role==="facility" ? D().facilities.filter(f=>f.id===S.as) : D().facilities;
  const budgets = facs.map(f=>{
    const inv = sum(D().invoices.filter(i=>i.facilityId===f.id && i.createdAt>=year).map(i=>i.total));
    const committed = sum(D().assigns.filter(a=>a.facilityId===f.id && a.status!=="cancelled" && a.end>=year).map(a=>{
      const s = a.start<year ? year : a.start, wks = Math.max(0,(daysBetween(s,a.end)+1)/7);
      return a.bill*a.hours*wks;
    }));
    return {f,inv,committed,budget:f.budget||0};
  });
  const acts = sc.activity.slice(0,F.actN);
  const periods = [["month","This month"],["quarter","This quarter"],["ytd","Year to date"],["all","All time"]];

function openSearch(){
  openDialog("Search", `
    <input type="search" id="pal-q" placeholder="Requisitions, candidates, clinicians, invoices, vendors…" aria-label="Search" autocomplete="off">
    <div class="pal-list" id="pal-res" role="listbox" aria-label="Results"></div>
    <p class="tiny muted">Enter opens the first result. Esc closes.</p>`, null, null);
  const draw = () => {
    const q = norm($("pal-q").value), sc = scope(), out = [];
    const hit = s => !q || norm(s).includes(q);
    TABS.filter(t=>allowedTabs().includes(t)).forEach(t=>{ const l = $("t-"+t).firstChild.textContent.trim(); if(q && hit(l)) out.push({k:"Go to",l,act:"go",tab:t}); });
    sc.reqs.forEach(r=>{ if(hit(`${reqNo(r)} ${reqTitle(r)} ${facName(r.facilityId)} ${r.unit}`)) out.push({k:reqNo(r),l:reqTitle(r),s:`${facName(r.facilityId)} · ${r.status}`,act:"req-view",id:r.id}); });
    sc.subs.forEach(s=>{ const r = byId("reqs",s.reqId); if(q && hit(`${s.cand.name} ${s.cand.lic}`)) out.push({k:"Candidate",l:s.cand.name,s:`${reqNo(r)} · ${stageLabel(s.stage)} · ${venName(s.vendorId)}`,act:"req-view",id:s.reqId}); });
    sc.assigns.forEach(a=>{ if(q && hit(`${a.worker} ${a.title}`)) out.push({k:"Clinician",l:a.worker,s:`${a.title} · ${facName(a.facilityId)}`,act:"asg-onboard",id:a.id}); });
    sc.invoices.forEach(i=>{ if(q && hit(`INV-${i.no} ${i.no} ${facName(i.facilityId)}`)) out.push({k:`INV-${i.no}`,l:facName(i.facilityId),s:`${usd(i.total)} · ${i.status}`,act:"inv-view",id:i.id}); });
    if(S.role==="admin"){
      D().vendors.forEach(v=>{ if(q && hit(v.name)) out.push({k:"Vendor",l:v.name,s:`Tier ${v.tier}`,act:"ven-edit",id:v.id}); });
      D().facilities.forEach(f=>{ if(q && hit(f.name)) out.push({k:"Facility",l:f.name,s:f.setting,act:"fac-edit",id:f.id}); });
    }
    $("pal-res").innerHTML = out.slice(0,30).map((o,i)=>`<button type="button" role="option" class="${i===0?"on":""}" data-act="${o.act}" ${o.id?`data-id="${esc(o.id)}"`:""} ${o.tab?`data-tab="${o.tab}"`:""}><span class="k">${esc(o.k)}</span><span><b>${esc(o.l)}</b>${o.s?`<span class="sub2">${esc(o.s)}</span>`:""}</span></button>`).join("") || `<p class="muted small" style="padding:8px 10px">Nothing matches “${esc($("pal-q").value)}”.</p>`;
  };
  $("pal-q").addEventListener("input",draw);
  $("pal-q").addEventListener("keydown",e=>{
    const items = [...$("pal-res").querySelectorAll("button")];
    let i = items.findIndex(b=>b.classList.contains("on"));
    if(e.key==="ArrowDown" || e.key==="ArrowUp"){ e.preventDefault(); i = Math.max(0,Math.min(items.length-1,i+(e.key==="ArrowDown"?1:-1))); items.forEach((b,j)=>b.classList.toggle("on",j===i)); items[i]?.scrollIntoView({block:"nearest"}); }
    if(e.key==="Enter"){ e.preventDefault(); items[Math.max(0,i)]?.click(); }
  });
  draw();
  $("pal-q").focus();
}

const dlg = $("dlg");
let dlgSubmit = null;
function openDialog(title, body, submitLabel, onSubmit, extra=""){
  dlgSubmit = onSubmit;
  dlg.innerHTML = `<form id="dlg-form" novalidate>
    <div class="dlg-head"><h2 id="dlg-title">${esc(title)}</h2><button type="button" class="btn quiet sm" data-act="dlg-close" aria-label="Close">Close</button></div>
    ${body}
    <p class="msg bad" id="dlg-err" role="alert" hidden></p>
    ${(submitLabel || extra) ? `<div class="dlg-foot">${submitLabel ? `<button class="btn" type="submit">${esc(submitLabel)}</button>` : ""}${extra}<span class="spacer"></span>${submitLabel ? `<button type="button" class="btn quiet" data-act="dlg-close">Cancel</button>` : ""}</div>` : ""}
  </form>`;
  $("dlg-form").addEventListener("submit", async e=>{
    e.preventDefault();
    if(!dlgSubmit) return;
    const form = e.target;
    const bad = [...form.elements].find(x=>x.willValidate && !x.checkValidity());
    if(bad){ $("dlg-err").textContent = `${(bad.closest("fieldset")?.querySelector("legend")?.textContent || bad.closest("label")?.firstChild?.textContent || "A field").trim()}: ${bad.validationMessage}`; $("dlg-err").hidden = false; bad.focus(); return; }
    const fd = Object.fromEntries(new FormData(form));
    const err = await dlgSubmit(fd);
    if(typeof err==="string"){ $("dlg-err").textContent = err; $("dlg-err").hidden = false; return; }
    dlg.close();
  });
  if(!dlg.open) dlg.showModal();
  dlg.querySelector("input:not([type=hidden]):not([disabled]):not([type=checkbox]),select:not([disabled]),textarea:not(#rf-paste)")?.focus();
}

  "asg-end": el => endForm(el.dataset.id),
  "ts-new": () => tsForm(),
  "ts-edit": el => tsForm(el.dataset.id),
  "ts-view": el => tsView(el.dataset.id),
  "ts-approve": el => approveTime([el.dataset.id]),
  "ts-approve-all": () => approveTime(scope().timesheets.filter(t=>t.status==="submitted").map(t=>t.id)),
  "ts-reject": el => rejectForm(el.dataset.id),
  "inv-make": () => makeInvoices(),
  "inv-view": el => invView(el.dataset.id),
  "inv-status": async el => { const i = byId("invoices",el.dataset.id); if(await Store.put("invoices",{...i,status:el.dataset.v})){ toast(`INV-${i.no} marked ${el.dataset.v}`); log(`Marked INV-${i.no} ${el.dataset.v}`,{col:"invoices",id:i.id,facilityId:i.facilityId}); invView(i.id); } },
  "inv-csv": el => invCSV(el.dataset.id),
  "rep-csv": () => repCSV(),
  "act-more": () => { F.actN += 25; renderTab(); },
  "ask": el => askData(el),
  "ven-edit": el => venForm(el.dataset.id),
  "fac-edit": el => facForm(el.dataset.id)
};
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el || !ACT[el.dataset.act] || el.disabled) return;
  // a button inside a clickable row shouldn't also trigger the row
  e.stopPropagation();
  ACT[el.dataset.act](el);
});
document.addEventListener("keydown", e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if((e.key==="k" || e.key==="K") && (e.ctrlKey || e.metaKey)){ e.preventDefault(); openSearch(); }
  else if(e.key==="/" && !typing && !dlg.open){ e.preventDefault(); openSearch(); }
});
$("demo-toggle").addEventListener("change",e=>{ S.demoPref = e.target.checked; render(); });
$("role").addEventListener("change",e=>{ S.role = e.target.value; S.as = ""; ensureAs(); SS.set("sbvms.role",S.role); SS.set("sbvms.as",S.as); render(); });
$("as").addEventListener("change",e=>{ S.as = e.target.value; SS.set("sbvms.as",S.as); render(); });

/* tooltip */
const tipEl = $("tip");
function showTip(t, x, y){ tipEl.textContent=t; tipEl.hidden=false; const w=tipEl.offsetWidth, h=tipEl.offsetHeight; tipEl.style.left=Math.min(innerWidth-w-8, Math.max(8,x-w/2))+"px"; tipEl.style.top=Math.max(8,y-h-12)+"px"; }
document.addEventListener("pointermove", e=>{ const t=e.target.closest?.("[data-tip]"); if(t) showTip(t.dataset.tip,e.clientX,e.clientY); else tipEl.hidden=true; });
document.addEventListener("focusin", e=>{ const t=e.target.closest?.("[data-tip]"); if(t){ const r=t.getBoundingClientRect(); showTip(t.dataset.tip,r.left+r.width/2,r.top); } });
document.addEventListener("focusout", ()=>{ tipEl.hidden=true; });
addEventListener("scroll", ()=>{ tipEl.hidden=true; }, {passive:true});

/* boot */
S.demo = buildDemo();
const hashTab = (location.hash||"").slice(1);
let start = TABS.includes(hashTab) ? hashTab : SS.get("sbvms.tab","dash");
tab = TABS.includes(start) ? start : "dash";
ensureAs();
showTab(tab);
connect();
</script>
</body>
</html>
